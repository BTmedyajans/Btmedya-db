plugins { id 'com.android.application' }

android {
    namespace 'com.btmedya.admin'
    compileSdk 35

    defaultConfig {
        applicationId 'com.btmedya.admin'
        minSdk 23
        targetSdk 35
        versionCode 10000
        versionName '1.0.0'
    }

    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.create('releaseEnv') {
                    storeFile file(project.property('RELEASE_STORE_FILE'))
                    storePassword project.property('RELEASE_STORE_PASSWORD')
                    keyAlias project.property('RELEASE_KEY_ALIAS')
                    keyPassword project.property('RELEASE_KEY_PASSWORD')
                }
            }
        }
    }
}
