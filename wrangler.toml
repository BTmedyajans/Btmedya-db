# Cloudflare Workers Builds bu Worker'ı otomatik deploy eder.
# Alan adı bağlantıları da bu dosyada tutulur: GitHub = kaynak gerçek.
name = "btmedya-db"
main = "src/worker.js"
compatibility_date = "2026-09-02"

[observability]
enabled = true

[assets]
directory = "public"
binding = "ASSETS"

# API ve medya istekleri önce Worker'a gitmeli; aksi halde Static Assets
# katmanı mevcut olmayan /api/* yollarını 404 olarak keser.
run_worker_first = ["/api/*", "/media/*", "/pub/*", "/", "/haberler/*", "/hakkimizda*", "/iletisim*"]

not_found_handling = "404-page"

# BTMEDYA ana alan adı ve www sürümü doğrudan bu Worker'a bağlanır.
# Cloudflare Custom Domain modeli DNS ve SSL bağlantısını Cloudflare tarafında yönetir.
# www isteği Worker içinde ana domaine 301 yönlendirilir.
[[routes]]
pattern = "btmedya.com.tr"
custom_domain = true

[[routes]]
pattern = "www.btmedya.com.tr"
custom_domain = true

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "btmedya-media"

# Workers KV: production kodu şu anda KV binding kullanmıyor.
# Eski/placeholder KV ID'si eklenmeyecek. KV ancak kod gerçekten ihtiyaç
# duyduğunda gerçek namespace ID ile bağlanacaktır.

[[d1_databases]]
binding = "DB"
database_name = "btmedya-media"
database_id = "94a980cd-62c5-4c29-b7fc-40f96ab665e4"

[vars]
MEDIA_PUBLIC_TTL = "86400"

# Secrets — bu dosyaya YAZILMAZ, `wrangler secret put` ile eklenir:
#   ADMIN_PASSWORD        -> /admin/ giriş şifresi
#   ADMIN_SESSION_SECRET  -> oturum çerezi imzalama anahtarı
#   MEDIA_SIGNING_SECRET  -> /media/ imzalı bağlantı anahtarı
#   AI_READ_TOKEN         -> (opsiyonel) salt-okur AI erişim token'ı
#   RESEND_API_KEY        -> (opsiyonel) Resend e-posta bildirimi API anahtarı
#   RESEND_TO             -> (opsiyonel) bildirim alıcı adresi
#   RESEND_FROM           -> (opsiyonel) gönderici adresi
