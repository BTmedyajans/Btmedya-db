# Cloudflare Workers Builds bu Worker'ı otomatik deploy eder.
# Alan adı bağlantıları da bu dosyada tutulur: GitHub = kaynak gerçek.
# Production deploy gate: .github/workflows/deploy.yml.
# Production sync finalization trigger: current main must pass all live-chain gates.
# Production chain audit: 2026-09-28 — Workers Builds is the canonical live deploy path.
# Audit trigger: 2026-09-28 production chain revalidation / live smoke retrigger.
# Live repair: re-trigger Workers Builds so declared Custom Domains are reconciled.
# Live repair retrigger: 2026-10-01 — rebuild production from canonical main to reconcile apex/www.
# DNS administration is intentionally kept outside the application deploy path.
name = "btmedya-db"
main = "src/worker.js"
compatibility_date = "2026-09-19"
# Production Cloudflare account ID is configuration, not a secret.
account_id = "55874710e92e21e5d37bfa5f384e04bd"

[observability]
enabled = true

[assets]
directory = "public"
binding = "ASSETS"

# API ve medya istekleri önce Worker'a gitmeli; aksi halde Static Assets
# katmanı mevcut olmayan /api/* yollarını 404 olarak keser.
run_worker_first = ["/api/*", "/media/*", "/pub/*", "/", "/index.html", "/haber/*", "/haberler", "/haberler/*", "/hakkimizda*", "/iletisim*", "/hizmetler*", "/sosyal-medya*", "/video-produksiyon*", "/whatsapp-katalog*", "/basin-kiti*", "/vaka-calismalari*", "/gizlilik*", "/admin/*", "/gorsel/*", "/social-studio/*", "/kaynak-masasi*", "/portfoy/*", "/robots.txt", "/llms.txt", "/llms-full.txt", "/index.json", "/jsonld", "/sitemap.xml", "/news-sitemap.xml", "/rss.xml", "/.well-known/*"]

not_found_handling = "404-page"

[[routes]]
pattern = "btmedya.com.tr"
custom_domain = true

[[routes]]
pattern = "www.btmedya.com.tr"
custom_domain = true

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "btmedya-media"

[[kv_namespaces]]
binding = "KV"
id = "41a0fc3c9e9848fca750d2283d4d1fc3"

[[d1_databases]]
binding = "DB"
database_name = "btmedya-media"
database_id = "94a980cd-62c5-4c29-b7fc-40f96ab665e4"

[vars]
MEDIA_PUBLIC_TTL = "86400"
ADMIN_USERNAME = "busetuncay74@gmail.com"
METRICOOL_CONNECTED_NETWORKS = "tiktok,youtube"
METRICOOL_PERSONAL_CONNECTED_NETWORKS = ""
METRICOOL_KULLANICI_NO = "5278969"
METRICOOL_USER_ID = "5278969"
METRICOOL_BRAND_ID = "6858384"
METRICOOL_CREATOR_EMAIL = "busetuncay74@gmail.com"
METRICOOL_ACCOUNT_EMAIL = "busetuncay74@gmail.com"
METRICOOL_TIMEZONE = "Europe/Istanbul"

[secrets]
required = [
  "ADMIN_PASSWORD_SECRET",
  "ADMIN_SESSION_SECRET_SECRET",
  "MEDIA_SIGNING_SECRET",
]

[[services]]
binding = "SABAH_YAZICI"
service = "btmedya-db"
entrypoint = "SabahYazici"

[[workflows]]
name = "btmedya-content"
binding = "BTMEDYA_WORKFLOW"
class_name = "BtmedyaWorkflow"

[[durable_objects.bindings]]
name = "WORKFLOW_STATUS"
class_name = "WorkflowStatusDO"

[[migrations]]
tag = "workflow-v1"
new_sqlite_classes = ["WorkflowStatusDO"]

[ai]
binding = "AI"

[version_metadata]
binding = "SURUM"

[triggers]
crons = ["*/5 * * * *", "*/15 * * * *", "0 5 * * *"]
