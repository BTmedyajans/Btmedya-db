# Cloudflare Workers Builds bu Worker'ı otomatik deploy eder.
# Alan adı bağlantıları da bu dosyada tutulur: GitHub = kaynak gerçek.
# Production DNS temizliği, cloudflare-admin workflow'undaki güvenli kayıt filtresiyle yapılır.
# Automation: GitHub Cloudflare admin workflow is the production DNS/deploy gate.
name = "btmedya-db"
main = "src/worker.js"
compatibility_date = "2026-09-19"

[observability]
enabled = true

[assets]
directory = "public"
binding = "ASSETS"

# API ve medya istekleri önce Worker'a gitmeli; aksi halde Static Assets
# katmanı mevcut olmayan /api/* yollarını 404 olarak keser.
run_worker_first = ["/api/*", "/media/*", "/pub/*", "/", "/haber/*", "/haberler/*", "/hakkimizda*", "/iletisim*", "/admin/*", "/social-studio/*", "/robots.txt", "/sitemap.xml", "/rss.xml"]

not_found_handling = "404-page"

# Ana alan adı Custom Domain olarak Worker'ın origin'i.
# www mevcut DNS kaydı nedeniyle Custom Domain olarak oluşturulamıyor.
# www için Cloudflare zone route kullanıyoruz; Worker /www isteğini
# ana domaine 301 yönlendiriyor. Böylece mevcut proxied DNS kaydı korunur.
[[routes]]
pattern = "btmedya.com.tr"
custom_domain = true

[[routes]]
pattern = "www.btmedya.com.tr/*"
zone_name = "btmedya.com.tr"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "btmedya-media"

# Workers KV: production kodu şu anda KV binding kullanmıyor.
# Eski/placeholder KV ID'si eklenmeyecek. KV ancak kod gerçekten ihtiyaç
# duyduğunda gerçek namespace ID ile bağlanacaktır.

[[d1_databases]]
binding = "DB"
database_name = "btmedya-media"
database_id = "94a980cd-62c5-4c29-b7fc-40f96ab665e4"

[vars]
MEDIA_PUBLIC_TTL = "86400"

# Secret değerleri GitHub'a veya bu dosyaya yazılmaz.
# Cloudflare Worker > Settings > Variables and Secrets altında Secret olarak eklenir.
# wrangler deploy, aşağıdaki required secret isimlerini doğrular.
[secrets]
required = [
  "ADMIN_PASSWORD",
  "ADMIN_SESSION_SECRET",
  "MEDIA_SIGNING_SECRET",
]

# Opsiyonel:
#   AI_READ_TOKEN         -> salt-okur AI erişim token'ı
#   RESEND_API_KEY        -> Resend e-posta bildirim API anahtarı
#   RESEND_TO             -> bildirim alıcı adresi
#   RESEND_FROM           -> gönderici adresi


# Cloudflare Workflow: BTMEDYA içerik/onay otomasyonu
[[workflows]]
name = "btmedya-content"
binding = "BTMEDYA_WORKFLOW"
class_name = "BtmedyaWorkflow"

# Workflow durumlarını ve canlı panel bildirimlerini tutan Durable Object
[[durable_objects.bindings]]
name = "WORKFLOW_STATUS"
class_name = "WorkflowStatusDO"

# Durable Object için SQLite tabanlı migration
[[migrations]]
tag = "workflow-v1"
new_sqlite_classes = ["WorkflowStatusDO"]
