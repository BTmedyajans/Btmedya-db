# Canonical source: GitHub repository BTmedyajans/Btmedya-db, branch main.
# Production deploy: .github/workflows/deploy-production.yml (validated Wrangler deploy + live smoke).
# The Cloudflare API currently has no Workers Builds config for this Worker, so do not assume a CF Builds push deploy.
# DNS administration remains outside the application deploy path.
# Production chain marker: 2026-10-12 native social queue without Metricool.
# DNS administration is intentionally kept outside the application deploy path.
name = "btmedya-db"
main = "src/worker.js"
compatibility_date = "2026-09-19"
# Production Cloudflare account ID is configuration, not a secret.
account_id = "b239acae17aebe894ea76309fe32cdce"

[observability]
enabled = true
redact_query_string = true

[assets]
directory = "public"
binding = "ASSETS"

# API ve medya istekleri önce Worker'a gitmeli; aksi halde Static Assets
# katmanı mevcut olmayan /api/* yollarını 404 olarak keser.
run_worker_first = ["/assets/*.mp4", "/assets/*.webm", "/api/*", "/media/*", "/hero-media/*", "/pub/*", "/", "/index.html", "/haber/*", "/haberler", "/haberler/*", "/hakkimizda*", "/iletisim*", "/hizmetler*", "/sosyal-medya*", "/video-produksiyon*", "/whatsapp-katalog*", "/basin-kiti*", "/vaka-calismalari*", "/arsiv*", "/dosyalar*", "/siyah-oda*", "/halk-roportaji*", "/gizlilik*", "/kunye*", "/teklif-al*", "/referanslar*", "/yayin-ilkeleri*", "/admin/*", "/gorsel/*", "/social-studio/*", "/kaynak-masasi*", "/kaynaklar*", "/portfoy/*", "/marka-kiti*", "/search-strategy*", "/programmatic-seo*", "/ai-lab*", "/reklam-ve-sponsorluk*", "/robots.txt", "/llms.txt", "/llms-full.txt", "/index.json", "/jsonld", "/sitemap.xml", "/news-sitemap.xml", "/rss.xml", "/.well-known/*", "/en", "/en/*"]

not_found_handling = "404-page"

# Ana ve www alan adları aynı Worker'a Custom Domain olarak bağlanır.
# Worker /www isteğini ana domaine 301 yönlendirir.
[[routes]]
pattern = "btmedya.com.tr"
custom_domain = true

[[routes]]
pattern = "www.btmedya.com.tr"
custom_domain = true

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "btmedya-media"

# Login brute-force koruması: IP başına başarısız denemeler 15 dakika tutulur.
[[kv_namespaces]]
binding = "KV"
id = "41a0fc3c9e9848fca750d2283d4d1fc3"

[[d1_databases]]
binding = "DB"
database_name = "btmedya-media"
database_id = "94a980cd-62c5-4c29-b7fc-40f96ab665e4"

[vars]
MEDIA_PUBLIC_TTL = "86400"
# BTMEDYA admin login user. This is a non-secret identifier; the password remains a Worker Secret.
ADMIN_USERNAME = "busetuncay74@gmail.com"
# Non-secret metadata read from the connected Metricool BTMEDYA brand.
# This does not change the primary publisher; the native direct OAuth route remains active.
METRICOOL_USER_ID = "5278969"
METRICOOL_BRAND_ID = "6858384"
METRICOOL_TIMEZONE = "Europe/Istanbul"
METRICOOL_CONNECTED_NETWORKS = "tiktok,youtube"
# Primary social publisher: BTMEDYA native queue with official platform OAuth.
# New and approved legacy-panel posts are queued to directly authorized accounts.
# Metricool credentials/brand settings are not required for this path.
BTMEDYA_SOCIAL_PUBLISHER = "direct"
# Güvenli kaynak/doğrulama kapılarını geçen haberlerde otomatik yayın açıktır;
# hassas, tanıtım, tekrar veya denetimden kalan içerikler yine taslak kalır.
BTMEDYA_AUTO_PUBLISH = "true"

# Secret değerleri GitHub'a veya bu dosyaya yazılmaz.
# Production security sync: main değişikliği, GitHub secret -> Cloudflare Worker secret senkronizasyonunu da tetikler.
# Cloudflare Worker > Settings > Variables and Secrets altında Secret olarak eklenir.
# wrangler deploy, aşağıdaki required secret isimlerini doğrular.
# Süreli recovery Secret biçimi: UNIX_SANIYE:geçici-kod
# Süre dolunca otomatik olarak geçersiz olur; production'da kullanımdan sonra silinmelidir.
[secrets]
required = [
  "ADMIN_PASSWORD_SECRET",
  "ADMIN_SESSION_SECRET_SECRET",
  "MEDIA_SIGNING_SECRET",
]

# Opsiyonel:
#   AI_READ_TOKEN         -> salt-okur AI erişim token'ı
#   RESEND_API_KEY        -> Resend e-posta bildirim API anahtarı
#   RESEND_TO             -> bildirim alıcı adresi
#   RESEND_FROM           -> gönderici adresi

# Sabah Masası kategori işçisi: Worker kendi SabahYazici giriş noktasını
# çağırır. Her kategori ayrı çağrıda çalışır; ücretsiz planın çağrı başına
# 50 dış istek sınırı 8 kategoriyi tek çağrıda kaldırmıyor.
[[services]]
binding = "SABAH_YAZICI"
service = "btmedya-db"
entrypoint = "SabahYazici"

# Cloudflare Workflow: BTMEDYA içerik/onay otomasyonu
[[workflows]]
name = "btmedya-content"
binding = "BTMEDYA_WORKFLOW"
class_name = "BtmedyaWorkflow"

# Workflow durumlarını ve canlı panel bildirimlerini tutan Durable Object
[[durable_objects.bindings]]
name = "WORKFLOW_STATUS"
class_name = "WorkflowStatusDO"

# Durable Object için SQLite tabanlı legacy migration akışı.
# Bu Worker daha önce bu migration modelini kullanacak şekilde yapılandırıldı.
[[migrations]]
tag = "workflow-v1"
new_sqlite_classes = ["WorkflowStatusDO"]


# Haber Bulucu: kaynakları periyodik olarak tarar, sonuçları D1'de taslak olarak tutar.
# Canli surumun kimligi ve yuklenme zamani; /api/health ve panel
# Control Center bunu gosterir, dagitim bekcisi bununla kaymayi yakalar.
# Sabah Masası özgün metin yazımı (Workers AI). Ek anahtar gerektirmez.
[ai]
binding = "AI"

[version_metadata]
binding = "SURUM"

[triggers]
# */5: nabız, sosyal kuyruk, R2 köprüsü. 0 5: Sabah Masası (08:00 İstanbul).
crons = ["*/5 * * * *", "*/10 * * * *", "*/15 * * * *", "*/30 * * * *", "0 5 * * *"]
