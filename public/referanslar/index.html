<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BTMEDYA • Referanslarımız</title><meta name="description" content="BTMEDYA tarafından firmalar için üretilen web, sosyal medya, video, içerik ve dijital çalışmalar."><style>:root{color-scheme:dark;--bg:#050707;--p:#101313;--line:#272d2b;--txt:#f5f7f5;--mut:#9aa49f;--lime:#d7ff4f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#17231c 0,#050707 48%);color:var(--txt);font:15px/1.55 Inter,system-ui,sans-serif}.wrap{max-width:1250px;margin:auto;padding:28px 18px 60px}.eyebrow{color:var(--lime);letter-spacing:.16em;font-size:11px;font-weight:800}.head{padding:55px 0 35px}.head h1{font-size:clamp(40px,7vw,82px);line-height:.92;margin:12px 0}.head p{max-width:720px;color:var(--mut);font-size:17px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{display:block;color:inherit;text-decoration:none;background:var(--p);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#657653}.cover{aspect-ratio:16/10;background:#151918;display:grid;place-items:center;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.copy{padding:17px}.copy small{color:var(--lime);text-transform:uppercase;letter-spacing:.1em}.copy h2{margin:7px 0;font-size:21px}.copy p{color:var(--mut);margin:0}.empty{padding:40px;border:1px dashed var(--line);border-radius:16px;color:var(--mut)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.wrap{padding:18px 12px}.grid{grid-template-columns:1fr}.head{padding:35px 0 25px}}</style></head><body><main class="wrap"><header class="head"><div class="eyebrow">BTMEDYA / PORTFOLYO</div><h1>REFERANSLARIMIZ</h1><p>Firmalar için ürettiğimiz içerikler, dijital kampanyalar, sosyal medya çalışmaları, web projeleri ve prodüksiyon işleri. Her profil, müşteri onayı ve yayın izni verilen çalışmalar üzerinden oluşturulur.</p></header><section id="grid" class="grid"><div class="empty">Referanslar yükleniyor…</div></section></main><script>const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));async function load(){const r=await fetch('/api/client-hub/public/references',{cache:'no-store'});const d=await r.json();const items=d.items||[];$('#grid').innerHTML=items.map(x=>`<a class="card" href="/referanslar/${encodeURIComponent(x.slug)}"><div class="cover">${x.cover_key?`<img src="/media/${encodeURIComponent(x.cover_key)}" alt="${esc(x.title)}" loading="lazy">`:'<span class="eyebrow">BTMEDYA CASE STUDY</span>'}</div><div class="copy"><small>${esc(x.sector||'Dijital çalışma')}</small><h2>${esc(x.title)}</h2><p>${esc(x.summary||x.client_name||'BTMEDYA proje çalışması')}</p></div></a>`).join('')||'<div class="empty">Henüz yayınlanmış referans bulunmuyor.</div>'}load().catch(()=>{$('#grid').innerHTML='<div class="empty">Referanslar şu anda yüklenemedi.</div>'});</script></body></html>
