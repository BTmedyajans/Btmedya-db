<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>BTMEDYA · Kategori Merkezi</title>
<link rel="stylesheet" href="/admin/admin-menu.css?v=20261007-5">
<script src="/admin/admin-menu.js?v=20261007-5" defer></script>
<style>
:root{color-scheme:dark;--bg:#070909;--p:#101414;--p2:#0c1010;--line:#29302e;--txt:#f4f7f5;--mut:#929c97;--lime:#d7ff4f;--ok:#73e59b;--warn:#ffd166}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#172018 0,#070909 45%);color:var(--txt);font:14px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:1450px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}
.k{color:var(--lime);font:800 11px/1.2 ui-monospace,monospace;letter-spacing:.14em}.head h1{font-size:clamp(34px,6vw,62px);line-height:.95;margin:6px 0}.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:300px 1fr;gap:14px}.panel{background:rgba(16,20,20,.95);border:1px solid var(--line);border-radius:18px;padding:16px}
.list{display:grid;gap:8px}.cat{width:100%;text-align:left;border:1px solid var(--line);background:#0b0f0f;color:var(--txt);border-radius:12px;padding:13px;cursor:pointer}.cat.active{border-color:#64764e;background:#172016}.cat b{display:block}.cat small{display:block;color:var(--mut);margin-top:3px}
.badge{display:inline-flex;padding:4px 7px;border:1px solid var(--line);border-radius:999px;font-size:10px;font-weight:800;color:var(--lime);margin-top:8px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#111616;color:var(--txt);padding:10px 13px;border-radius:10px;cursor:pointer;text-decoration:none}.btn.primary{background:var(--lime);color:#071000;border-color:var(--lime);font-weight:800}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:15px}.rule{border:1px solid var(--line);border-radius:12px;background:#0b0f0f;padding:12px}.rule b{display:block;margin-bottom:4px}.score{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}.score div{border:1px solid var(--line);border-radius:11px;padding:10px;background:#0b0f0f}.score strong{display:block;font-size:22px}.score span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:14px}.flow div{border:1px dashed #39423e;border-radius:10px;padding:10px;text-align:center;color:var(--mut)}.flow b{display:block;color:var(--txt);font-size:12px;margin-bottom:3px}
.checks{display:grid;gap:7px;margin-top:14px}.check{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px}.check i{font-style:normal;color:var(--ok)}
@media(max-width:850px){.grid{grid-template-columns:1fr}.rules{grid-template-columns:1fr}.score{grid-template-columns:repeat(2,1fr)}.flow{grid-template-columns:1fr 1fr}.head{display:block}}
</style>
</head>
<body>
<main class="wrap">
<header class="head">
<div><div class="k">BTMEDYA / KATEGORİ MERKEZİ</div><h1>İçeriği doğru yere yönlendir.</h1><p class="mut">Web sitesindeki hamburger menü ile aynı kategori ağacını kullanır. Her kategori için üretim, SEO, medya ve yayın ölçütleri burada sabitlenir.</p></div>
<div class="toolbar"><a class="btn" href="/admin/">← Yönetim</a><a class="btn primary" href="/admin/editor/">İçerik oluştur</a></div>
</header>
<section class="grid">
<aside class="panel"><div class="k">KATEGORİLER</div><p class="mut">Kategori seç; sağdaki ölçütler ve üretim akışını gör.</p><div id="cats" class="list"></div></aside>
<section class="panel">
<div id="detail"></div>
</section>
</section>
</main>
<script>
const DATA=[
{key:"haber",name:"HABER",desc:"Haber üretimi, araştırma, SEO ve yayın.",color:"01",score:[95,90,88,92,90],rules:[
["Kaynak","En az bir doğrulanabilir kaynak; kritik iddialar ikinci kaynakla kontrol edilir."],
["Başlık","Ana konu + yer/kişi/kurum + merak unsuru; gereksiz clickbait yok."],
["SEO","Tek ana arama niyeti, temiz slug, meta açıklama ve iç bağlantı."],
["Medya","Gerçek ve konuya uygun görsel/video; alt metin ve telif durumu kontrol edilir."],
["Yayın","Taslak → editör kontrolü → önizleme → onay → yayın; sosyal varyantlar ayrıca hazırlanır."]]},
{key:"sosyal",name:"SOSYAL MEDYA",desc:"Kişisel, BTMEDYA ve müşteri hesapları için içerik ve dağıtım.",color:"02",score:[88,94,92,86,90],rules:[
["Platform","Instagram, Facebook, TikTok, YouTube, X ve WhatsApp için platforma uygun varyant."],
["İlk saniye","Video varsa ilk 1–3 saniyede konu/vaat netleşir; kapak mobilde okunur."],
["Metin","Kısa, konuşma diline uygun, tek CTA; platformun karakter ve format sınırlarına göre."],
["Önizleme","Yayınlamadan önce telefon/masaüstü görünümü ve bağlantı kartı kontrol edilir."],
["Ölçüm","Gerçek performans ile tahmin ayrı tutulur; izlenme, tutma, CTR ve etkileşim sonradan işlenir."]]},
{key:"tanitim",name:"TANITIM",desc:"Medya, video, proje, teklif ve AI üretimi.",color:"03",score:[91,87,95,89,92],rules:[
["Marka","Logo, renk, tipografi ve marka dili korunur; AI içerik gerekiyorsa işaretlenir."],
["Video","Hook → değer → kanıt → CTA yapısı; mobil kadraj ve altyazı güvenli alanı."],
["Portföy","Gerçek iş, müşteri izni, sonuç/kanıt ve hizmet türü birlikte tutulur."],
["Teklif","Hizmet, kapsam, teslim, bütçe ve iletişim CTA'sı net olmalı."],
["Yayın","Web önizleme → SEO → sosyal önizleme → onay → yayın ve performans takibi."]]}
];
let active=0;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
 const c=DATA[active];
 document.querySelector("#cats").innerHTML=DATA.map((x,i)=>'<button class="cat '+(i===active?'active':'')+'" data-i="'+i+'"><b>'+x.color+' · '+x.name+'</b><small>'+x.desc+'</small><span class="badge">ÖLÇÜTLER TANIMLI</span></button>').join("");
 document.querySelector("#detail").innerHTML='<div class="k">'+c.color+' / '+c.name+'</div><h2>'+c.name+'</h2><p class="mut">'+c.desc+'</p>'+
 '<div class="score">'+["SEO","İÇERİK","MEDYA","YAYIN","GENEL"].map((x,i)=>'<div><span>'+x+'</span><strong>'+c.score[i]+'</strong></div>').join("")+'</div>'+
 '<div class="rules">'+c.rules.map((r,i)=>'<article class="rule"><b>0'+(i+1)+' · '+esc(r[0])+'</b><span class="mut">'+esc(r[1])+'</span></article>').join("")+'</div>'+
 '<div class="k" style="margin-top:22px">ÜRETİM AKIŞI</div><div class="flow">'+["Kategori seç","AI / editör","Canlı önizleme","SEO + tutma","Onay / yayın"].map((x,i)=>'<div><b>'+x+'</b>'+["Doğru içerik alanını belirle","Seçtiğin AI operatörü çalışır","Web + sosyal görünümü izle","Tahmin ve gerçek veriyi ayır","Yayın zincirine gönder"][i]+'</div>').join("")+'</div>'+
 '<div class="checks">'+c.rules.map(r=>'<div class="check"><i>✓</i><span><b>'+esc(r[0])+'</b> · '+esc(r[1])+'</span></div>').join("")+'</div>'+
 '<div class="toolbar" style="margin-top:16px"><a class="btn primary" href="/admin/editor/?kategori='+encodeURIComponent(c.key)+'">Bu kategori için içerik oluştur</a><a class="btn" href="/admin/social-os/?kategori='+encodeURIComponent(c.key)+'">Sosyal önizlemeye git</a><a class="btn" href="/admin/site-os/">Site sağlığını kontrol et</a></div>';
 document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{active=Number(b.dataset.i);render()});
}
render();
</script>
</body></html>
