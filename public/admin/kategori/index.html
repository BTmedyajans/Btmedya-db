<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>BTMEDYA · Kategori ve Otomasyon Merkezi</title>
<link rel="stylesheet" href="/admin/admin-menu.css?v=20261007-tax">
<script src="/admin/admin-menu.js?v=20261007-tax" defer></script>
<style>
:root{color-scheme:dark;--bg:#07090b;--p:#0f1417;--p2:#0b1013;--line:#263238;--txt:#f1f5f6;--mut:#91a0a8;--acc:#a6d9ea;--ok:#7be3a2;--warn:#ffd166}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#152029 0,#07090b 52%);color:var(--txt);font:14px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:1540px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.ey{color:var(--acc);font:800 10px/1.2 ui-monospace,monospace;letter-spacing:.14em}.head h1{font-size:clamp(34px,6vw,64px);line-height:.92;margin:7px 0;letter-spacing:-.045em}.mut{color:var(--mut);max-width:900px}
.grid{display:grid;grid-template-columns:320px 1fr;gap:14px;margin-top:18px}.panel{background:rgba(15,20,23,.96);border:1px solid var(--line);border-radius:18px;padding:16px}
.tabs{display:grid;gap:8px}.tab{border:1px solid var(--line);background:#0a0f12;color:#fff;text-align:left;border-radius:13px;padding:14px;cursor:pointer}.tab.active{border-color:#57707c;background:#122028}.tab b{display:block;font-size:15px}.tab small{display:block;color:var(--mut);margin-top:4px}
.intent{margin-top:13px;padding:12px;border:1px solid #2f4149;border-radius:12px;background:#0b1115}.intent b{display:block;color:var(--acc);font-size:11px;letter-spacing:.08em}.intent p{margin:6px 0 0;color:#c0cbd0}
.topGrid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.heroCard{padding:2px 0}.heroCard h2{margin:2px 0 8px;font-size:32px;letter-spacing:-.03em}.badge{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font:800 10px ui-monospace,monospace;color:var(--acc)}
.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.group{border:1px solid var(--line);border-radius:14px;background:#0a0f12;padding:12px}.group h3{margin:0 0 8px;color:var(--acc);font:800 10px ui-monospace,monospace;letter-spacing:.12em}.leaf{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.07)}.leaf:first-of-type{border-top:0}.leaf b{font-size:13px}.leaf small{display:block;color:var(--mut);margin-top:2px}.leaf .auto{white-space:nowrap;font-size:9px;color:var(--ok)}
.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}.mx{border:1px solid var(--line);border-radius:11px;padding:10px;background:#0a0f12}.mx b{display:block;font-size:12px}.mx small{color:var(--mut)}.core{border-color:#35505b}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.flow div{border:1px dashed #3a4a52;border-radius:11px;padding:10px;text-align:center;color:var(--mut)}.flow b{display:block;color:#fff;margin-bottom:3px;font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid var(--line);background:#10171b;color:#fff;text-decoration:none;border-radius:10px;padding:10px 13px;font-weight:800}.btn.primary{background:var(--acc);border-color:var(--acc);color:#091116}
.why{margin-top:14px;border:1px solid #304148;border-radius:14px;padding:13px;background:#0b1114}.why b{display:block;color:var(--acc)}.why p{margin:7px 0 0;color:#c0cbd0}
@media(max-width:980px){.grid{grid-template-columns:1fr}.topGrid{grid-template-columns:1fr}.groups{grid-template-columns:1fr}.matrix{grid-template-columns:1fr}.flow{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="wrap">
<header class="head">
  <div><div class="ey">BTMEDYA / TAXONOMY CONTROL PLANE</div><h1>Kategori seç.<br>Akış otomatik hizalansın.</h1><p class="mut">Bu ekran sitenin ve admin panelinin ortak kategori sözlüğünü gösterir. Seçilen ana yol; içerik türü, medya, yayın kanalı, otomasyon ve müşteri akışını aynı bağlama getirir.</p></div>
  <div class="toolbar"><a class="btn" href="/admin/agency-os/">← Süpervizör</a><a class="btn primary" href="/admin/editor/">İçerik üret</a></div>
</header>

<div class="grid">
  <aside class="panel">
    <div class="ey">03 ANA YOL</div>
    <div id="tabs" class="tabs" style="margin-top:10px"></div>
    <div id="intent" class="intent"></div>
  </aside>
  <section class="panel">
    <div id="detail"></div>
  </section>
</div>
</main>

<script>
function boot(){
 const T=window.BTMEDYA_TAXONOMY;if(!T)return;
 const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 let active=0;
 const tabs=document.querySelector('#tabs'),intent=document.querySelector('#intent'),detail=document.querySelector('#detail');
 function render(){
  const p=T.paths[active];
  tabs.innerHTML=T.paths.map((x,i)=>'<button class="tab '+(i===active?'active':'')+'" data-i="'+i+'"><b>'+esc(x.number)+' · '+esc(x.label)+'</b><small>'+esc(x.description)+'</small></button>').join('');
  intent.innerHTML='<b>MÜŞTERİ NİYETİ</b><p>'+esc(p.customerIntent)+'</p>';
  detail.innerHTML='<div class="topGrid"><div class="heroCard"><div class="ey">'+esc(p.number)+' / '+esc(p.shortLabel)+'</div><h2>'+esc(p.label)+'</h2><p class="mut">'+esc(p.description)+'</p></div><div class="why"><b>SUPERVISOR KARARI</b><p>Bu alan seçildiğinde ana üretim ekranları '+esc(p.label)+' bağlamını taşır. Kullanıcı ayrı araçlar arasında kaybolmak yerine aynı iş akışında kalır.</p></div></div>'+
    '<div class="groups">'+p.groups.map(g=>'<article class="group"><h3>'+esc(g.label)+'</h3>'+g.items.map(i=>'<div class="leaf"><div><b>'+esc(i.label)+'</b><small>'+esc(i.short)+'</small></div><span class="auto">'+(i.automation||[]).slice(0,2).map(esc).join(' · ')+'</span></div>').join('')+'</article>').join('')+'</div>'+
    '<div class="ey" style="margin-top:18px">KATEGORİ → ENTEGRASYON</div><div class="matrix">'+T.system.core.map(x=>'<div class="mx core"><b>'+esc(x.label)+'</b><small>'+esc(x.role)+'</small></div>').join('')+T.system.adapters.filter(a=>{const hit=p.groups.some(g=>g.items.some(i=>(i.automation||[]).includes(a.key)));return hit}).slice(0,8).map(x=>'<div class="mx"><b>'+esc(x.label)+'</b><small>'+esc(x.role)+' · '+esc(x.mode)+'</small></div>').join('')+'</div>'+
    '<div class="ey" style="margin-top:18px">OPERASYON AKIŞI</div><div class="flow"><div><b>01 · SEÇ</b>Niyet + kategori</div><div><b>02 · ÜRET</b>Metin + medya</div><div><b>03 · KONTROL</b>SEO / kalite / onay</div><div><b>04 · DAĞIT</b>Native API + fallback</div><div><b>05 · ÖLÇ</b>Sonuç + arşiv</div></div>'+
    '<div class="toolbar"><a class="btn primary" href="'+esc(p.publicHref)+'">Canlı kategoriyi aç ↗</a><a class="btn" href="/admin/agency-os/">Süpervizör</a><a class="btn" href="/admin/site-os/">Site sağlığı</a></div>';
  tabs.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{active=Number(b.dataset.i);render()});
 }
 render();
}
if(window.BTMEDYA_TAXONOMY)boot();else{const s=document.createElement('script');s.src='/data/btmedya-taxonomy.js';s.onload=boot;document.head.appendChild(s)}
</script>
</body></html>
