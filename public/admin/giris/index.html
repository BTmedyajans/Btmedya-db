<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05080c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/admin/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>BTMEDYA Yönetim · Giriş</title>
<link rel="icon" href="/assets/logo/bt-amblem-128.webp">
<style>
/* 6 Ekim: /admin/ oturumsuz okura giriş formu yerine yönetim merkezine
   yönlendiren sayfayı veriyordu; merkez de oturum isteyip /admin/'e geri
   gönderdiği için panel sonsuz döngüde kalıyordu. Bu sayfa /admin/
   adresinde yalnız oturum yokken sunulur (src/worker.js). */
:root{color-scheme:dark;--zemin:#05080c;--kart:rgba(255,255,255,.05);--cizgi:rgba(255,255,255,.14);--yazi:#eef3f7;--soluk:rgba(238,243,247,.62);--vurgu:#d9ff3f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--zemin);color:var(--yazi);font:16px/1.5 Manrope,Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:grid;place-items:center;min-height:100svh;padding:24px 16px;background:radial-gradient(60% 50% at 50% 0%,rgba(217,255,63,.08),transparent 70%),var(--zemin)}
main{width:100%;max-width:400px}
.marka{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.marka img{width:44px;height:44px;border-radius:12px}
.marka b{display:block;font-size:18px;letter-spacing:.04em}
.marka small{color:var(--soluk);font:600 11px/1.3 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.12em}
form{padding:24px;border:1px solid var(--cizgi);border-radius:20px;background:var(--kart);backdrop-filter:blur(12px)}
h1{margin:0 0 6px;font-size:24px;letter-spacing:-.02em}
p{margin:0 0 20px;color:var(--soluk);font-size:14px}
label{display:block;margin:14px 0 6px;font-weight:700;font-size:13px}
input{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--cizgi);border-radius:12px;background:rgba(0,0,0,.35);color:var(--yazi);font:16px/1.2 Manrope,Inter,system-ui,sans-serif}
input:focus{outline:2px solid var(--vurgu);outline-offset:1px}
button{width:100%;min-height:50px;margin-top:20px;border:0;border-radius:12px;background:var(--vurgu);color:#071000;font:800 16px/1 Manrope,Inter,system-ui,sans-serif;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.mesaj{min-height:22px;margin:12px 0 0;font-size:14px;color:#ffb0ab}
.mesaj.ok{color:var(--vurgu)}
.alt{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-size:13px}
.alt a{color:var(--soluk);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.alt a:hover{color:var(--yazi)}
</style>
</head>
<body>
<main>
  <div class="marka"><img src="/assets/logo/bt-amblem-128.webp" alt="" width="44" height="44"><div><b>BTMEDYA</b><small>YÖNETİM PANELİ</small></div></div>
  <form id="giris" novalidate>
    <h1>Giriş yap</h1>
    <p>Haber, medya, sosyal dağıtım ve otomasyonlar tek panelde.</p>
    <label for="kullanici">Kullanıcı adı</label>
    <input id="kullanici" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" value="BTMEDYA" required>
    <label for="sifre">Şifre</label>
    <input id="sifre" name="password" type="password" autocomplete="current-password" required>
    <button id="gonder" type="submit">Giriş yap</button>
    <p class="mesaj" id="mesaj" role="status" aria-live="polite"></p>
  </form>
  <div class="alt"><a href="/">← Siteye dön</a><a href="/iletisim/">Yardım</a></div>
</main>
<script>
(()=>{
  const form=document.getElementById('giris'), mesaj=document.getElementById('mesaj'), gonder=document.getElementById('gonder');
  // Giriş sonrası hedef: yalnız panel içi adres kabul edilir (açık yönlendirme yok).
  const sonra=new URLSearchParams(location.search).get('sonra')||'';
  const hedef=/^\/admin\/(?!giris\/)[a-z0-9\-\/._?=&%]*$/i.test(sonra)?sonra:'/admin/agency-os/';
  document.getElementById(document.getElementById('kullanici').value?'sifre':'kullanici').focus();
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const sifre=document.getElementById('sifre').value;
    if(!sifre){mesaj.className='mesaj';mesaj.textContent='Şifre gerekli.';return;}
    gonder.disabled=true; mesaj.className='mesaj'; mesaj.textContent='Giriş yapılıyor…';
    try{
      const r=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.getElementById('kullanici').value.trim(),password:sifre})});
      const j=await r.json().catch(()=>({}));
      if(r.status===429) throw new Error(j.error||'Çok fazla deneme. 15 dakika sonra tekrar deneyin.');
      if(!r.ok) throw new Error('Kullanıcı adı ya da şifre hatalı.'+(typeof j.remaining==='number'?' Kalan deneme: '+j.remaining+'.':''));
      mesaj.className='mesaj ok'; mesaj.textContent='Giriş başarılı, panel açılıyor…';
      location.replace(hedef);
    }catch(err){
      mesaj.className='mesaj'; mesaj.textContent=err.message||'Giriş yapılamadı.'; gonder.disabled=false;
    }
  });
})();
</script>
<script src="/admin/pwa-install.js" defer></script>
</body>
</html>
