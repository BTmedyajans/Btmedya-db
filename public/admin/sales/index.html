<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BTMEDYA Sales Desk</title><meta name="robots" content="noindex,nofollow"><style>
:root{color-scheme:dark;--bg:#080808;--panel:#111;--line:#292929;--text:#eee;--muted:#999;--accent:#d9ff3f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:32px 4vw 70px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:25px}h1{font-size:clamp(30px,5vw,58px);margin:4px 0}.k{color:var(--accent);letter-spacing:.14em;font-size:11px;font-weight:800}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.stat{border:1px solid var(--line);padding:12px 15px;background:var(--panel);min-width:120px}.stat b{display:block;font-size:24px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,select,button{background:#151515;color:#fff;border:1px solid var(--line);padding:11px 12px;border-radius:6px}button{cursor:pointer}button:hover{border-color:#666}.board{display:grid;grid-template-columns:repeat(7,minmax(180px,1fr));gap:10px;overflow:auto}.col{background:#0e0e0e;border:1px solid var(--line);min-height:360px}.col h2{font-size:12px;letter-spacing:.12em;padding:14px;margin:0;border-bottom:1px solid var(--line)}.card{margin:10px;padding:13px;background:#151515;border:1px solid #252525;border-radius:7px}.card strong{display:block;font-size:15px}.meta{color:var(--muted);font-size:12px;line-height:1.55;margin-top:7px}.actions{display:flex;gap:5px;margin-top:10px}.actions select{width:100%;padding:7px;font-size:12px}.temas{margin-top:34px;border-top:1px solid var(--line);padding-top:22px}.temas h2{font-size:12px;letter-spacing:.12em;margin:0 0 6px}.temas table{width:100%;max-width:760px;border-collapse:collapse;margin-top:12px}.temas td,.temas th{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px}.temas th{color:var(--muted);font-weight:600}@media(max-width:900px){.board{grid-template-columns:repeat(7,220px)}} 
</style><link rel="stylesheet" href="/admin/admin-menu.css?v=20261007-3"><script src="/admin/admin-menu.js?v=20261007-3" defer></script></head><body><main><div id="categoryContext" style="border:1px solid #3a4932;background:#111;padding:12px 14px;border-radius:8px;margin-bottom:18px"></div><header><div><div class="k">BTMEDYA / SALES DESK</div><h1>Satış hunisi.</h1><div style="color:var(--muted)">Web, WhatsApp ve teklif taleplerini tek kuyrukta yönetin.</div></div><a href="/admin/" style="color:#fff">← Yönetim</a></header><div class="stats" id="stats"></div><div class="toolbar"><input id="q" placeholder="Müşteri, firma, e-posta ara"><button onclick="load()">Yenile</button><a href="/teklif-al/" style="padding:11px;color:#fff">Teklif formu ↗</a></div><div class="board" id="board"></div><section class="temas"><h2>SİTEDEKİ TEMASLAR · SON 30 GÜN</h2><div style="color:var(--muted)">WhatsApp, telefon ve e-posta bağlantısına tıklama, sayfa bazında. Botlar ve ?olcum=kapat diyen ekip tarayıcıları sayılmaz.</div><div id="temas"></div></section></main><script>
function renderCategoryContext(){const k=sessionStorage.getItem('btmedya-admin-category')||'tanitim';const m={haber:['HABER','Editoryal talep ve haber müşteri temasları'],sosyal:['SOSYAL MEDYA','Sosyal medya hizmeti ve müşteri fırsatları'],tanitim:['TANITIM','Teklif, proje ve tanıtım fırsatları']};const x=m[k]||m.tanitim;document.getElementById('categoryContext').innerHTML='<div class="k">AKTİF YÖNETİM MODU</div><b>'+x[0]+'</b><div style="color:var(--muted);font-size:12px">'+x[1]+'</div>'}renderCategoryContext();
const stages=['new','contacted','qualified','proposal','meeting','won','lost'],names={new:'YENİ',contacted:'İLETİŞİM',qualified:'NİTELİKLİ',proposal:'TEKLİF',meeting:'GÖRÜŞME',won:'KAZANILDI',lost:'KAYBEDİLDİ'};
async function api(u,o){const r=await fetch(u,o);if(r.status===401){location='/admin/';return null}return r.json()}
async function move(id,stage){await api('/api/sales/lead/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({stage})});load()}
async function load(){const q=document.getElementById('q').value.trim();const d=await api('/api/sales/leads'+(q?'?q='+encodeURIComponent(q):''));if(!d)return;const counts=Object.fromEntries((d.counts||[]).map(x=>[x.stage,Number(x.count)]));document.getElementById('stats').innerHTML=stages.map(s=>'<div class="stat"><span>'+names[s]+'</span><b>'+(counts[s]||0)+'</b></div>').join('');document.getElementById('board').innerHTML=stages.map(s=>'<section class="col"><h2>'+names[s]+'</h2>'+d.items.filter(x=>x.stage===s).map(x=>'<article class="card"><strong>'+esc(x.name)+'</strong><div class="meta">'+esc(x.company||'')+'<br>'+esc(x.service||'')+'<br>'+esc(x.email||x.phone||'')+'<br>'+esc(x.budget||'')+(x.source?'<br><small>'+esc(x.source)+'</small>':'')+'</div><div class="actions"><select onchange="move(\''+x.id+'\',this.value)">'+stages.map(z=>'<option value="'+z+'" '+(z===x.stage?'selected':'')+'>'+names[z]+'</option>').join('')+'</select></div></article>').join('')+'</section>').join('')}
async function temas(){const d=await api('/api/sales/temas?gun=30');if(!d)return;const ad={whatsapp:'WhatsApp',telefon:'Telefon',eposta:'E-posta'};const el=document.getElementById('temas');if(!d.items||!d.items.length){el.innerHTML='<p style="color:var(--muted)">Henüz kayıtlı temas yok.</p>';return}el.innerHTML='<table><thead><tr><th>Sayfa</th><th>Kanal</th><th>Tıklama</th></tr></thead><tbody>'+d.items.map(t=>'<tr><td>'+esc(t.sayfa)+'</td><td>'+esc(ad[t.kanal]||t.kanal)+'</td><td><b>'+Number(t.sayi)+'</b></td></tr>').join('')+'</tbody></table>'}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
load();temas();setInterval(load,60000);
</script></body></html>
