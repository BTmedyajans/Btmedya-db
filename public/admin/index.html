<body>
<main><div class="box"><div><span class="pulse"></span><strong>BTMEDYA Yönetim Merkezi</strong></div><p>Yönetim paneli ayrı güvenli Worker adresinde çalışır. Giriş merkezi açılıyor.</p><a id="panel" href="https://btmedya-db.btmedya.com.tr/admin">Panele geç</a></div></main>
<script>
/* Site üzerindeki /admin adresi gerçek yönetim Worker'ına bağlanır.
   Worker hostunda çalışırken aynı adrese yönlendirme yapılmaz, böylece döngü oluşmaz. */
const ADMIN_ORIGIN='https://btmedya-db.btmedya.com.tr';
if(location.hostname==='btmedya.com.tr' || location.hostname==='www.btmedya.com.tr'){
  location.replace(ADMIN_ORIGIN+'/admin');
}else{
  location.replace('/admin/agency-os/?v=20261006');
}
</script>
