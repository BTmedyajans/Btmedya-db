<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070C12">
<title>Sayfa bulunamadı · BTMEDYA</title>
<meta name="description" content="Aradığınız sayfa BTMEDYA'da bulunamadı. Haber arşivine ya da anasayfaya dönebilirsiniz.">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070C12'/%3E%3Cg fill='none' stroke='%2335D6FF' stroke-width='2'%3E%3Cpath d='M5 11V5h6'/%3E%3Cpath d='M27 11V5h-6'/%3E%3Cpath d='M5 21v6h6'/%3E%3Cpath d='M27 21v6h-6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/home.css">
<style>
  .yok{min-height:100vh;display:grid;place-items:center;padding:120px var(--pad,5vw) 80px;position:relative;z-index:2;background:radial-gradient(circle at 50% 30%,rgba(53,214,255,.12),transparent 34%)}
  .yok-ic{max-width:min(680px,92vw);text-align:center}
  .yok .kod{font-family:var(--mono,'JetBrains Mono',monospace);font-size:12px;letter-spacing:.22em;color:var(--cyan);display:block;margin-bottom:22px}
  .yok h1{font-family:var(--display,'Bricolage Grotesque',sans-serif);font-size:clamp(34px,6vw,68px);line-height:1.04;letter-spacing:-.035em}
  .yok p{margin-top:20px;color:var(--muted,#9b9b9b);font-size:clamp(15px,1.3vw,17px);line-height:1.7}
  .yok .yollar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:34px}
  .yok .kadraj{display:block;margin:0 auto 40px;width:76px;height:76px}
  .yok .kadraj svg{position:static;width:100%;height:100%;inset:auto}
  .yok .kadraj svg path{stroke-dashoffset:0}
  .yok .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:1px solid var(--line,rgba(255,255,255,.16));font:10px var(--mono,'JetBrains Mono',monospace);letter-spacing:.11em;text-decoration:none;color:var(--fg,#f5f5f2)}
  .yok .btn-primary{background:var(--cyan);border-color:var(--cyan);color:#031117}
  .yok .btn:hover{border-color:var(--cyan);transform:translateY(-2px)}
  .nav-cta{font:10px var(--mono,'JetBrains Mono',monospace);letter-spacing:.12em;border:1px solid var(--line,rgba(255,255,255,.16));padding:11px 14px}
  footer{position:relative;z-index:2;padding:24px var(--pad,5vw);border-top:1px solid var(--line,rgba(255,255,255,.12));color:var(--muted,#9b9b9b);font:10px var(--mono,'JetBrains Mono',monospace)}
</style>
</head>
<body>

<div class="env" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="/" aria-label="BTMEDYA ana sayfa">
    <img src="/assets/btmedya-emblem-derived.png" alt="" aria-hidden="true" width="26" height="26">
    <b>BT</b><span>MEDYA</span>
  </a>
  <a class="nav-cta" href="/">ANASAYFA</a>
</header>

<main class="yok" id="main" tabindex="-1">
  <div class="yok-ic">
    <span class="kadraj" aria-hidden="true">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">
        <path d="M0 26 V0 H26" fill="none" stroke="#35D6FF" stroke-width="4"/>
        <path d="M74 0 H100 V26" fill="none" stroke="#35D6FF" stroke-width="4"/>
        <path d="M100 74 V100 H74" fill="none" stroke="#35D6FF" stroke-width="4"/>
        <path d="M26 100 H0 V74" fill="none" stroke="#35D6FF" stroke-width="4"/>
      </svg>
    </span>
    <span class="kod">404</span>
    <h1>Bu kare boş çıktı.</h1>
    <p>Aradığınız sayfa yok, taşınmış ya da adresi yanlış yazılmış olabilir. Aşağıdan devam edebilirsiniz.</p>
    <div class="yollar">
      <a class="btn btn-primary" href="/">ANASAYFAYA DÖN</a>
      <a class="btn btn-ghost" href="/haberler/">HABER ARŞİVİ</a>
      <a class="btn btn-ghost" href="/iletisim/">İLETİŞİM</a>
    </div>
  </div>
</main>

<footer>
  <p class="legal">© 2026 BTMEDYA · Balıkesir, Türkiye</p>
</footer>

</body>
</html>
