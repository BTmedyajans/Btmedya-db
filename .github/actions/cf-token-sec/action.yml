name: Cloudflare token seç
description: >
  Aday Cloudflare token'larını sırayla gerçekten dener ve işin gerektirdiği
  yetkiye sahip ilk geçerli olanı CLOUDFLARE_API_TOKEN olarak ortama yazar.
  Eski davranış "ilk dolu secret"ı alıyordu; o secret iptal edilmişse (Cloudflare
  9109 "Invalid access token") arkadaki geçerli token'lar hiç denenmiyordu.
inputs:
  gerek:
    description: "Gereken yetki: zone | workers | d1 | r2 | any"
    required: true
  zorunlu:
    description: "true ise uygun token yoksa adım başarısız olur; false ise CF_TOKEN_YOK=1 yazılır."
    required: false
    default: "true"
  cloudflare_deploy_token: {required: false, default: ""}
  cloudflare_api_token: {required: false, default: ""}
  btmedya_db1: {required: false, default: ""}
  btmedya_d1: {required: false, default: ""}
  cloudflare_d1_api_token: {required: false, default: ""}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GEREK: ${{ inputs.gerek }}
        ZORUNLU: ${{ inputs.zorunlu }}
        ADAY_CLOUDFLARE_DEPLOY_TOKEN: ${{ inputs.cloudflare_deploy_token }}
        ADAY_CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare_api_token }}
        ADAY_BTMEDYA_DB1: ${{ inputs.btmedya_db1 }}
        ADAY_BTMEDYA_D1: ${{ inputs.btmedya_d1 }}
        ADAY_CLOUDFLARE_D1_API_TOKEN: ${{ inputs.cloudflare_d1_api_token }}
      run: bash "${{ github.action_path }}/sec.sh"
