name: BTMEDYA Google Search Console

# Automated sitemap submission and URL inspection live in
# seo-search-console-sync.yml. Keep this workflow manual to avoid duplicate
# daily/push submissions; it remains useful for on-demand endpoint diagnostics.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  google:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate live indexing endpoints
        shell: bash
        run: |
          set -euo pipefail
          key="57fb863171638cffa9cdfb3913627b57"
          for url in \
            https://btmedya.com.tr/robots.txt \
            https://btmedya.com.tr/sitemap.xml \
            https://btmedya.com.tr/news-sitemap.xml \
            "https://btmedya.com.tr/${key}.txt"; do
            code="$(curl -LfsS -o /tmp/btmedya-endpoint.txt -w '%{http_code}' "$url")"
            test "$code" = "200"
            if [[ "$url" == *"${key}.txt" ]]; then
              grep -Fxq "$key" /tmp/btmedya-endpoint.txt
            fi
            echo "OK $code $url"
          done
          {
            echo "## Live indexing endpoints"
            echo "- robots.txt: 200"
            echo "- sitemap.xml: 200"
            echo "- news-sitemap.xml: 200"
            echo "- IndexNow key: 200 and content matched"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check Google credentials
        id: auth
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Google Search Console automation credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Google Search Console API çalıştırılmadı: GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON secret'ı eksik."
          fi

      - name: Setup Python
        if: steps.auth.outputs.configured == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Google API client
        if: steps.auth.outputs.configured == 'true'
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth

      - name: Submit sitemaps and inspect URLs
        if: steps.auth.outputs.configured == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PROPERTY: "https://btmedya.com.tr/"
        run: python tools/google-search-console.py

      - name: Pending authorization summary
        if: steps.auth.outputs.configured != 'true'
        shell: bash
        run: |
          {
            echo "## Google Search Console"
            echo ""
            echo "Live robots, sitemap and IndexNow endpoints passed; Google API automation is not yet authorized."
            echo ""
            echo "Required: add the automation service account to the verified Search Console property, then save its JSON credential as GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON in GitHub Actions secrets."
          } >> "$GITHUB_STEP_SUMMARY"
