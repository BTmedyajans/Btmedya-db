name: BTMEDYA Google Search Console

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "src/news-page.js"
      - "src/worker.js"
      - "tools/google-search-console.py"
      - ".github/workflows/google-search-console.yml"
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  google:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Google credentials
        id: auth
        shell: bash
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Google Search Console automation credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Google Search Console automation is prepared but waiting for one-time Search Console owner authorization and GitHub secret."
          fi

      - name: Setup Python
        if: steps.auth.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google API client
        if: steps.auth.outputs.configured == 'true'
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth

      - name: Submit sitemaps and inspect URLs
        if: steps.auth.outputs.configured == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PROPERTY: "https://btmedya.com.tr/"
        run: python tools/google-search-console.py

      - name: Pending authorization summary
        if: steps.auth.outputs.configured != 'true'
        shell: bash
        run: |
          {
            echo "## Google Search Console"
            echo ""
            echo "⚠️ Automation is ready but waiting for one-time Google owner authorization."
            echo ""
            echo "Required once: verify btmedya.com.tr in Search Console, add the automation service account as a verified owner, then store its JSON credential in the GitHub Actions secret GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON."
            echo "After that, this workflow submits both sitemaps and runs URL Inspection automatically."
          } >> "$GITHUB_STEP_SUMMARY"
