name: BTMEDYA Admin Android

on:
  push:
    branches: [main, android-admin-production]
    paths:
      - "android-admin/**"
      - ".github/workflows/android-admin-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        if: steps.signing.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Android debug and unsigned release
        working-directory: android-admin
        run: |
          gradle --no-daemon assembleDebug bundleRelease

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: btmedya-admin-android-${{ github.sha }}
          path: |
            android-admin/app/build/outputs/apk/debug/*.apk
            android-admin/app/build/outputs/apk/release/*.apk
            android-admin/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  signed-release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; unsigned artifacts remain available."
          fi

      - name: Checkout
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore signing key
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/btmedya-release.jks"

      - name: Build signed release
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android-admin
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/btmedya-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon \
            -PRELEASE_STORE_FILE="$RELEASE_STORE_FILE" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            assembleRelease bundleRelease

      - name: Upload signed release
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: btmedya-admin-signed-release-${{ github.sha }}
          path: |
            android-admin/app/build/outputs/apk/release/*.apk
            android-admin/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
