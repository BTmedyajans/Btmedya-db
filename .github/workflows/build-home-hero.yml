name: BTMEDYA Home Hero Build
on:
  push:
    paths:
      - 'public/index.html'
      - 'tools/giris-kaynak/**'
      - '.github/workflows/build-home-hero.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build HD hero films
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .hero-build
          clips=(
            tools/giris-kaynak/saha-gece.mp4
            tools/giris-kaynak/kamera-arkasi.mp4
            tools/giris-kaynak/studyo-masa.mp4
            tools/giris-kaynak/studyo-program.mp4
            tools/giris-kaynak/defile.mp4
          )
          build_clip(){
            local src="$1" out="$2" size="$3"
            ffmpeg -hide_banner -loglevel error -y -i "$src" -t 2.6 \
              -vf "scale=${size}:force_original_aspect_ratio=decrease:flags=lanczos,pad=${size}:(ow-iw)/2:(oh-ih)/2:color=black,setsar=1,fps=30,format=yuv420p" \
              -an -c:v libx264 -preset medium -crf 18 -movflags +faststart "$out"
          }
          i=0
          for src in "${clips[@]}"; do
            i=$((i+1))
            build_clip "$src" ".hero-build/d$i-desktop.mp4" "1920:1080"
            build_clip "$src" ".hero-build/d$i-mobile.mp4" "1080:1920"
          done
          printf "file '%s'\n" "$PWD/.hero-build/d1-desktop.mp4" "$PWD/.hero-build/d2-desktop.mp4" "$PWD/.hero-build/d3-desktop.mp4" "$PWD/.hero-build/d4-desktop.mp4" "$PWD/.hero-build/d5-desktop.mp4" > .hero-build/desktop.txt
          printf "file '%s'\n" "$PWD/.hero-build/d1-mobile.mp4" "$PWD/.hero-build/d2-mobile.mp4" "$PWD/.hero-build/d3-mobile.mp4" "$PWD/.hero-build/d4-mobile.mp4" "$PWD/.hero-build/d5-mobile.mp4" > .hero-build/mobile.txt
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i .hero-build/desktop.txt -c copy -movflags +faststart public/assets/media/web/btmedya-home-hero-hd.mp4
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i .hero-build/mobile.txt -c copy -movflags +faststart public/assets/media/web/btmedya-home-hero-mobile-hd.mp4
          ffprobe -v error -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of default=nw=1 public/assets/media/web/btmedya-home-hero-hd.mp4
          ffprobe -v error -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of default=nw=1 public/assets/media/web/btmedya-home-hero-mobile-hd.mp4
      - name: Commit generated hero assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BTMEDYA Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/media/web/btmedya-home-hero-hd.mp4 public/assets/media/web/btmedya-home-hero-mobile-hd.mp4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(web): generate HD archive-based home hero'
          git push
