name: BTMEDYA R2 archive sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/assets/**"
      - "public/media/**"
      - "public/data/medya-listesi.json"

permissions:
  contents: read

# Secrets are exposed through env so GitHub Actions conditionals can safely test
# whether they exist; the secret values themselves never enter the repository.
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Wrangler
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest

      - name: Cloudflare credential preflight
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          set -euo pipefail
          echo "WARNING: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured; R2 sync was skipped."

      - name: Sync static media
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            file="public/$key"
            [ -f "$file" ] || file="public/assets/$key"
            [ -f "$file" ] || file="public/media/$key"
            if [ -f "$file" ]; then
              echo "SYNC $key"
              wrangler r2 object put "btmedya-media/$key" --file "$file" --remote
            else
              echo "SKIP $key"
            fi
          done < <(node -e 'for (const x of require("./public/data/medya-listesi.json")) console.log(x.path)')
