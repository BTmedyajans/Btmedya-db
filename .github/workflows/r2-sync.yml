name: BTMEDYA R2 archive sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/assets/**"
      - "public/media/**"
      - "public/data/medya-listesi.json"
      - ".github/workflows/r2-sync.yml"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cloudflare token select
        uses: ./.github/actions/cf-token-sec
        with:
          gerek: r2
          zorunlu: "true"
          cloudflare_deploy_token: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          btmedya_db1: ${{ secrets.BTMEDYA_DB1 }}
          btmedya_d1: ${{ secrets.BTMEDYA_D1 }}
          cloudflare_d1_api_token: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}

      - name: R2 upload preflight
        env:
          CF_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: b239acae17aebe894ea76309fe32cdce
          R2_BUCKET: btmedya-media
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/r2/buckets/$R2_BUCKET" |
            jq -e '.success == true and .result.name == "btmedya-media"' >/dev/null
          echo "R2 bucket access verified."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install S3-compatible R2 client
        run: npm install --no-save --no-package-lock @aws-sdk/client-s3

      - name: Sync indexed assets into R2
        env:
          CF_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: b239acae17aebe894ea76309fe32cdce
          R2_BUCKET: btmedya-media
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { S3Client, PutObjectCommand, HeadObjectCommand } from '@aws-sdk/client-s3';

          const accountId = process.env.CF_ACCOUNT_ID;
          const apiToken = process.env.CF_API_TOKEN;
          const bucket = process.env.R2_BUCKET;
          if (!apiToken || !accountId || !bucket) throw new Error('R2 configuration missing');

          // Derive temporary S3 credentials from Cloudflare API-token authorization
          // is unsupported. Do not attempt uploads using the API token as an S3 secret.
          // This job validates the canonical manifest and inventories local assets only.
          const manifestPath = 'public/data/medya-listesi.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (!Array.isArray(manifest) || manifest.length === 0) throw new Error('Media manifest is empty');
          let checked = 0;
          for (const item of manifest) {
            const candidates = [path.join('public', item.path), path.join('public/assets', item.path), path.join('public/media', item.path)];
            const file = candidates.find(p => fs.existsSync(p) && fs.statSync(p).isFile());
            if (!file) throw new Error('Missing media asset referenced by manifest: ' + item.path);
            checked++;
          }
          console.log(JSON.stringify({manifestEntries: manifest.length, localFilesVerified: checked, nextAction: 'R2 upload requires an R2 S3 API access key/secret stored in GitHub secrets; Cloudflare API token cannot be used as S3 credentials.'}));
          NODE

      - name: Report upload readiness
        run: |
          {
            echo "## R2 media sync"
            echo ""
            echo "Canonical manifest and all local files were validated."
            echo "R2 object upload remains blocked until R2 S3 API credentials are added as GitHub Actions secrets."
          } >> "$GITHUB_STEP_SUMMARY"
