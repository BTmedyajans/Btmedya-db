name: BTMEDYA R2 archive sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/assets/**"
      - "public/media/**"
      - "public/data/medya-listesi.json"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest

      - name: Sync static media
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            file="public/$key"
            [ -f "$file" ] || file="public/assets/$key"
            [ -f "$file" ] || file="public/media/$key"
            if [ -f "$file" ]; then
              echo "SYNC $key"
              wrangler r2 object put "btmedya-media/$key" --file "$file" --remote
            else
              echo "SKIP $key"
            fi
          done < <(node -e 'for (const x of require("./public/data/medya-listesi.json")) console.log(x.path)')
