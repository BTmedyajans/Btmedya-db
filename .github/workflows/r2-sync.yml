name: BTMEDYA R2 archive sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/assets/**"
      - "public/media/**"
      - "public/data/medya-listesi.json"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cloudflare credential preflight
        id: preflight
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are configured; R2 sync will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: Cloudflare credentials are not configured; R2 sync is skipped."
          fi

      - name: Setup Wrangler
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        run: npm install --global wrangler@latest

      - name: Sync static media
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            file="public/$key"
            [ -f "$file" ] || file="public/assets/$key"
            [ -f "$file" ] || file="public/media/$key"
            if [ -f "$file" ]; then
              echo "SYNC $key"
              wrangler r2 object put "btmedya-media/$key" --file "$file" --remote
            else
              echo "SKIP $key"
            fi
          done < <(node -e 'for (const x of require("./public/data/medya-listesi.json")) console.log(x.path)')
