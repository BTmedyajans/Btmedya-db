name: BTMEDYA Responsive A11y Smoke

on:
  push:
    branches: [main]
    paths:
      - "public/**/*.html"
      - "public/**/*.css"
      - "public/**/*.js"
      - "src/**"
      - "wrangler.toml"
      - "tools/responsive-a11y-smoke.mjs"
      - ".github/workflows/responsive-a11y-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * *"

permissions:
  contents: read

jobs:
  smoke:
    name: 3 viewport live UX smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test live responsive and accessibility basics
        run: node tools/responsive-a11y-smoke.mjs
