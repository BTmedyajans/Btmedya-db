name: BTMEDYA Responsive A11y Smoke

on:
  push:
    branches: [main]
    paths:
      - "public/**/*.html"
      - "public/**/*.css"
      - "public/**/*.js"
      - "src/**"
      - "wrangler.toml"
      - "tools/responsive-a11y-smoke.mjs"
      - ".github/workflows/responsive-a11y-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * *"

permissions:
  contents: read

jobs:
  smoke:
    name: 3 viewport live UX smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Allow production deployment to settle
        run: sleep 45
      - name: Test live responsive and accessibility basics
        run: |
          set -euo pipefail
          echo "Testing current checkout: $(git rev-parse HEAD)"
          for attempt in 1 2 3; do
            echo "Live smoke attempt $attempt/3"
            if node tools/responsive-a11y-smoke.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Live deployment may still be propagating; retrying in 30s."
              sleep 30
            fi
          done
          echo "Live responsive/a11y smoke failed after 3 attempts."
          exit 1