name: BTMEDYA Responsive A11y Smoke

on:
  push:
    branches: [main]
    paths:
      - "public/**/*.html"
      - "public/**/*.css"
      - "public/**/*.js"
      - "src/**"
      - "wrangler.toml"
      - "tools/responsive-a11y-smoke.mjs"
      - ".github/workflows/responsive-a11y-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * *"

permissions:
  contents: read

jobs:
  smoke:
    name: 3 viewport live UX smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test live responsive and accessibility basics
        id: smoke
        continue-on-error: true
        run: node tools/responsive-a11y-smoke.mjs 2>&1 | tee smoke-output.txt
      - name: Publish smoke diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if grep -q 'RESPONSIVE_A11Y_SMOKE_FAILED' smoke-output.txt; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "CI smoke failure $GITHUB_SHA" --body-file smoke-output.txt --label "bug" || true
          fi
          cat smoke-output.txt
      - name: Fail when smoke fails
        if: steps.smoke.outcome == 'failure'
        run: exit 1
