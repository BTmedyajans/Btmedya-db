name: BTMEDYA Cloudflare reconcile

on:
  push:
    branches: ["main"]
    paths:
      - "wrangler.toml"
      - "src/**"
      - "public/**"
      - ".github/workflows/cloudflare-reconcile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btmedya-cloudflare-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconcile Worker and Custom Domains
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          command: deploy

      - name: Verify zone and DNS state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          zones="$(curl -fsS "${api}/zones?name=btmedya.com.tr&per_page=50" "${auth[@]}")"
          zone_id="$(jq -r '.result[] | select(.name=="btmedya.com.tr") | .id' <<<"$zones" | head -n1)"
          test -n "$zone_id"
          echo "Cloudflare zone: $zone_id"

          records="$(curl -fsS "${api}/zones/${zone_id}/dns_records?per_page=100&name=btmedya.com.tr" "${auth[@]}")"
          echo "Apex records:"
          jq -r '.result[] | [.type,.name,.content,.proxied] | @tsv' <<<"$records"

          www="$(curl -fsS "${api}/zones/${zone_id}/dns_records?per_page=100&name=www.btmedya.com.tr" "${auth[@]}")"
          echo "WWW records:"
          jq -r '.result[] | [.type,.name,.content,.proxied] | @tsv' <<<"$www"

          echo "Live HTTP checks:"
          curl -fsSIL --max-time 30 https://btmedya.com.tr/ | sed -n '1,12p'
          curl -fsSIL --max-time 30 https://www.btmedya.com.tr/ | sed -n '1,12p'
          curl -fsS --max-time 30 https://btmedya.com.tr/api/health | tee /tmp/health.json
          jq -e '.ok == true' /tmp/health.json
