name: Cloudflare administration

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Cloudflare action to run"
        required: true
        type: choice
        options:
          - verify
          - worker-deploy
      worker_name:
        description: "Worker name"
        required: false
        default: "btmedya-db"

permissions:
  contents: read

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Verify Cloudflare credentials
        if: inputs.action == 'verify'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          npx wrangler whoami

      - name: Deploy btmedya-db
        if: inputs.action == 'worker-deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          npx wrangler deploy --config wrangler.toml
