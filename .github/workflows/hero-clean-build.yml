name: BTMEDYA AI Hero Master

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hero-clean-build.yml"
      - "tools/giris-filmi-clean.py"
      - "tools/giris-kaynak/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btmedya-ai-hero-master
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build desktop and mobile homepage video
        run: |
          set -euo pipefail
          python3 tools/giris-filmi-clean.py
          test -s public/assets/media/web/giris-filmi-clean-genis.mp4
          test -s public/assets/media/web/giris-filmi-clean-genis-poster.jpg
          test -s public/assets/media/web/giris-filmi-clean.mp4
          test -s public/assets/media/web/giris-filmi-clean-poster.jpg

      - name: Validate generated media
        run: |
          set -euo pipefail
          for f in public/assets/media/web/giris-filmi-clean-genis.mp4 public/assets/media/web/giris-filmi-clean.mp4; do
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -show_entries format=duration -of default=noprint_wrappers=1 "$f"
          done

      - name: Verify homepage hero source configuration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          from pathlib import Path

          class HeroParser(HTMLParser):
              hero = None
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "video" and values.get("data-slot") == "hero-video":
                      self.hero = values

          parser = HeroParser()
          parser.feed(Path("public/index.html").read_text(encoding="utf-8"))
          if not parser.hero:
              raise SystemExit("Homepage hero video element was not found.")

          assets = {
              "data-genis": "btmedya-hero-web.mp4",
              "data-dikey": "btmedya-hero-mobile.mp4",
              "data-genis-webm": "btmedya-hero-web.webm",
              "data-dikey-webm": "btmedya-hero-mobile.webm",
              "data-genis-poster": "btmedya-hero-web-poster.jpg",
              "data-dikey-poster": "btmedya-hero-mobile-poster.jpg",
          }
          for attr, filename in assets.items():
              value = parser.hero.get(attr, "")
              parsed = urlsplit(value)
              expected_path = f"/assets/media/web/{filename}"
              if parsed.scheme or parsed.netloc or parsed.path != expected_path:
                  raise SystemExit(
                      f"Unexpected homepage hero source for {attr}: {value!r}; "
                      f"expected a site-local path {expected_path!r}."
                  )

          deploy_workflow = Path(".github/workflows/deploy-production.yml").read_text(encoding="utf-8")
          for filename in assets.values():
              if filename not in deploy_workflow:
                  raise SystemExit(
                      f"Production deployment does not declare hero asset {filename!r}."
                  )
          print("Homepage hero references match the assets generated by deploy-production.yml.")
          print("The immutable clean-hero Release below is published separately and does not rewrite production HTML.")
          PY

      - name: Publish immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="btmedya-clean-hero-${GITHUB_SHA:0:7}-run${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}"
          ASSETS=(
            public/assets/media/web/giris-filmi-clean-genis.mp4
            public/assets/media/web/giris-filmi-clean-genis-poster.jpg
            public/assets/media/web/giris-filmi-clean.mp4
            public/assets/media/web/giris-filmi-clean-poster.jpg
          )
          # GitHub immutable releases cannot have assets replaced. Use a unique
          # tag per workflow attempt and fail explicitly if that tag already exists.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Immutable release $TAG already exists; refusing to upload into it."
            exit 1
          fi
          gh release create "$TAG" "${ASSETS[@]}" \
            --title "BTMEDYA Clean Homepage Hero ${GITHUB_SHA:0:7} (run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT})" \
            --notes "Generated desktop and mobile homepage hero. Versioned assets from commit ${GITHUB_SHA}; workflow run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT}." \
            --target "${GITHUB_SHA}"
          echo "Release published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"

      - name: Verify release assets and rolling download URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="btmedya-clean-hero-${GITHUB_SHA:0:7}-run${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}"
          EXPECTED=$(printf '%s\n' \
            giris-filmi-clean-genis.mp4 \
            giris-filmi-clean-genis-poster.jpg \
            giris-filmi-clean.mp4 \
            giris-filmi-clean-poster.jpg | sort)
          ACTUAL=$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Release asset verification failed."
            printf 'Expected assets:\n%s\nActual assets:\n%s\n' "$EXPECTED" "$ACTUAL"
            exit 1
          fi
          for asset in giris-filmi-clean-genis.mp4 giris-filmi-clean.mp4 giris-filmi-clean-genis-poster.jpg giris-filmi-clean-poster.jpg; do
            curl --fail --silent --show-error --location --head --max-redirs 5 \
              "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/$asset" >/dev/null
          done
          echo "Verified all four assets in $TAG and confirmed latest-download URLs resolve."
