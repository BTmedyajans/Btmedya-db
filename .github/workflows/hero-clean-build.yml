name: BTMEDYA Clean Hero Video

on:
  push:
    branches: [main]
    paths:
      - "tools/giris-filmi-clean.py"
      - "tools/giris-kaynak/**"
      - ".github/workflows/hero-clean-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btmedya-clean-hero
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build clean hero variants
        run: |
          python3 tools/giris-filmi-clean.py
          test -s public/assets/media/web/giris-filmi-clean-genis.mp4
          test -s public/assets/media/web/giris-filmi-clean-genis-poster.jpg
          test -s public/assets/media/web/giris-filmi-clean.mp4
          test -s public/assets/media/web/giris-filmi-clean-poster.jpg

      - name: Publish generated hero to a versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="btmedya-clean-hero-${GITHUB_SHA:0:7}"
          gh release create "$TAG"             public/assets/media/web/giris-filmi-clean-genis.mp4             public/assets/media/web/giris-filmi-clean-genis-poster.jpg             public/assets/media/web/giris-filmi-clean.mp4             public/assets/media/web/giris-filmi-clean-poster.jpg             --title "BTMEDYA Clean Homepage Hero ${GITHUB_SHA:0:7}"             --notes "BTMEDYA homepage opening film. Video-only opening followed by three synchronized freeze moments where the website places HABER & MEDYA, SOSYAL & DİJİTAL and MARKA & PRODÜKSİYON labels."             --target "${GITHUB_SHA}"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
