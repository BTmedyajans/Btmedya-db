name: BTMEDYA Clean Hero Video

on:
  push:
    branches: [main]
    paths:
      - "tools/giris-filmi-clean.py"
      - "tools/giris-kaynak/**"
      - ".github/workflows/hero-clean-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btmedya-clean-hero
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build clean hero variants
        run: |
          python3 tools/giris-filmi-clean.py
          test -s public/assets/media/web/giris-filmi-clean-genis.mp4
          test -s public/assets/media/web/giris-filmi-clean-genis-poster.jpg
          test -s public/assets/media/web/giris-filmi-clean.mp4
          test -s public/assets/media/web/giris-filmi-clean-poster.jpg

      - name: Publish generated hero to a public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="btmedya-clean-hero"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing clean hero release."
          else
            gh release create "$TAG"               --title "BTMEDYA Clean Homepage Hero"               --notes "BTMEDYA homepage opening film. Video-only opening followed by three synchronized freeze moments where the website places HABER & MEDYA, SOSYAL & DİJİTAL and MARKA & PRODÜKSİYON labels."               --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG"             public/assets/media/web/giris-filmi-clean-genis.mp4             public/assets/media/web/giris-filmi-clean-genis-poster.jpg             public/assets/media/web/giris-filmi-clean.mp4             public/assets/media/web/giris-filmi-clean-poster.jpg             --clobber
          echo "Stable media URLs:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/giris-filmi-clean-genis.mp4"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/giris-filmi-clean.mp4"
