name: BTMEDYA deployment gate

on:
  push:
    branches: [main]
    paths:
      - "wrangler.toml"
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify production deployment
        id: gate
        env:
          GH_TOKEN: \${{ github.token }}
          COMMIT_TIME: \${{ github.event.head_commit.timestamp }}
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -uo pipefail

          if [ -z "\${COMMIT_TIME:-}" ]; then
            COMMIT_TIME="\$(date -u -d '-20 minutes' +%FT%TZ)"
          fi

          target="\$(date -u -d "\$COMMIT_TIME" +%s)"
          exact_sha=""
          live_time=""

          for attempt in \$(seq 1 20); do
            if [ -n "\${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "\${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
              builds="\$(curl -fsS --max-time 20 \
                -H "Authorization: Bearer \$CLOUDFLARE_API_TOKEN" \
                -H 'Content-Type: application/json' \
                "https://api.cloudflare.com/client/v4/accounts/\$CLOUDFLARE_ACCOUNT_ID/builds/builds/latest" 2>/dev/null || true)"

              exact_sha="\$(python3 - "\$builds" "\${GITHUB_REPOSITORY}" "\${GITHUB_REF_NAME}" <<'PY'
import json, sys
try:
    data=json.loads(sys.argv[1])
    repo=sys.argv[2]
    branch=sys.argv[3]
    for item in (data.get("result",{}).get("builds",{}) or {}).values():
        if not isinstance(item,dict) or item.get("build_outcome")!="success":
            continue
        meta=item.get("build_trigger_metadata") or {}
        if meta.get("repo_name")==repo and meta.get("branch")==branch:
            print(meta.get("commit_hash") or "")
            break
except Exception:
    pass
PY
              )"

              if [ "\$exact_sha" = "\$GITHUB_SHA" ]; then
                echo "PASS: Cloudflare Workers Builds commit SHA = \$GITHUB_SHA"
                exit 0
              fi
            fi

            health="\$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
              "https://btmedya.com.tr/api/health?deployment_gate=\$GITHUB_RUN_ID-\$attempt" 2>/dev/null || true)"

            live_time="\$(python3 - "\$health" <<'PY'
import json,sys
try:
    print((json.loads(sys.argv[1]).get("surum") or {}).get("yuklendi") or "")
except Exception:
    pass
PY
            )"

            if [ -n "\$live_time" ]; then
              live_epoch="\$(date -u -d "\$live_time" +%s 2>/dev/null || echo 0)"
              if [ "\$live_epoch" -ge "\$target" ]; then
                echo "PASS: production version timestamp = \$live_time"
                exit 0
              fi
            fi

            echo "Waiting for production deployment: attempt \$attempt/20"
            sleep 30
          done

          echo "FAIL: production deployment did not reach commit \${GITHUB_SHA} within 10 minutes."
          echo "Live timestamp: \${live_time:-unknown}"
          echo "Cloudflare SHA: \${exact_sha:-unknown}"
          exit 1

      - name: Open or update deployment issue
        if: failure()
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          title="Canlı dağıtım main'in gerisinde"
          body="Commit \`\${GITHUB_SHA}\` için production gate başarısız oldu. Cloudflare Workers Builds veya canlı Worker sürümünü kontrol edin. Run: https://github.com/\${GITHUB_REPOSITORY}/actions/runs/\${GITHUB_RUN_ID}"

          number="\$(gh issue list --repo "\$GITHUB_REPOSITORY" --state open --search "\"\$title\"" --json number,title --jq '.[] | select(.title=="'\$title'") | .number' | head -n1 || true)"

          if [ -n "\$number" ]; then
            gh issue comment "\$number" --repo "\$GITHUB_REPOSITORY" --body "\$body"
          else
            gh issue create --repo "\$GITHUB_REPOSITORY" --title "\$title" --body "\$body"
          fi
