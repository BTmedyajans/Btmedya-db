name: BTMEDYA HTML Cache Revalidate

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "src/worker.js"
      - ".github/workflows/html-cache-revalidate.yml"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btmedya-html-cache-revalidate
  cancel-in-progress: true

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::CLOUDFLARE_API_TOKEN secret eksik."
            exit 1
          }

      - name: Resolve zone
        id: zone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          response="$(curl -fsS --retry 2 --connect-timeout 15 --max-time 45 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "$api/zones?name=btmedya.com.tr&per_page=10")"
          success="$(jq -r '.success // false' <<<"$response")"
          zone_id="$(jq -r '.result[0].id // empty' <<<"$response")"
          test "$success" = "true"
          test -n "$zone_id"
          echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"

      - name: Revalidate live HTML
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/invalidate_cache"
          urls=(
            "https://btmedya.com.tr/"
            "https://www.btmedya.com.tr/"
            "https://btmedya.com.tr/en/"
            "https://btmedya.com.tr/haberler/"
            "https://btmedya.com.tr/kaynak-masasi/"
            "https://btmedya.com.tr/hakkimizda/"
            "https://btmedya.com.tr/iletisim/"
            "https://btmedya.com.tr/hizmetler/"
            "https://btmedya.com.tr/sosyal-medya/"
            "https://btmedya.com.tr/video-produksiyon/"
            "https://btmedya.com.tr/vaka-calismalari/"
            "https://btmedya.com.tr/reklam-ve-sponsorluk/"
            "https://btmedya.com.tr/sosyal-medya-kit/"
            "https://btmedya.com.tr/whatsapp-katalog/"
            "https://btmedya.com.tr/arsiv/"
            "https://btmedya.com.tr/portfoy/"
            "https://btmedya.com.tr/portfoy/buse-tuncay/"
            "https://btmedya.com.tr/ai-lab/"
            "https://btmedya.com.tr/robots.txt"
            "https://btmedya.com.tr/sitemap.xml"
            "https://btmedya.com.tr/news-sitemap.xml"
            "https://btmedya.com.tr/rss.xml"
            "https://btmedya.com.tr/.well-known/security.txt"
          )
          payload="$(printf '%s\n' "${urls[@]}" | jq -R -s 'split("\n") | map(select(length>0)) | {files:.}')"
          response="$(curl -fsS --retry 2 --connect-timeout 15 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$api")"
          success="$(jq -r '.success // false' <<<"$response")"
          if [ "$success" != "true" ]; then
            echo "::error::Cloudflare HTML cache revalidation başarısız."
            jq -c '{success,errors,messages}' <<<"$response"
            exit 1
          fi
          echo "Cloudflare HTML cache revalidation kabul edildi."
