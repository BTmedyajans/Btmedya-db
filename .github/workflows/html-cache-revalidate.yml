name: BTMEDYA HTML Cache Revalidate

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "src/worker.js"
      - ".github/workflows/html-cache-revalidate.yml"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btmedya-html-cache-revalidate
  cancel-in-progress: true

jobs:
  revalidate:
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be referenced directly in step-level if expressions.
      # Keep this credential separate from the Worker deployment token.
      CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
    steps:
      - name: Skip cache purge when the dedicated token is not configured
        if: ${{ env.CLOUDFLARE_CACHE_PURGE_TOKEN == '' }}
        shell: bash
        run: |
          echo "::notice::Cache purge skipped: add CLOUDFLARE_CACHE_PURGE_TOKEN with Zone Cache Purge permission to enable automatic HTML cache revalidation."

      - name: Revalidate live HTML cache
        if: ${{ env.CLOUDFLARE_CACHE_PURGE_TOKEN != '' }}
        env:
          ZONE_ID: 23c8b76d1d8ba4e41f04973a160db1f3
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache"
          urls=(
            "https://btmedya.com.tr/"
            "https://www.btmedya.com.tr/"
            "https://btmedya.com.tr/haberler/"
            "https://btmedya.com.tr/kaynak-masasi/"
            "https://btmedya.com.tr/robots.txt"
            "https://btmedya.com.tr/sitemap.xml"
            "https://btmedya.com.tr/news-sitemap.xml"
            "https://btmedya.com.tr/rss.xml"
            "https://btmedya.com.tr/.well-known/security.txt"
          )
          payload="$(printf '%s\n' "${urls[@]}" | jq -R -s 'split("\n") | map(select(length>0)) | {files:.}')"
          response_file="$(mktemp)"
          http_code="$(curl -sS --retry 2 --connect-timeout 15 --max-time 60 \
            -o "$response_file" -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_CACHE_PURGE_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$api" || true)"
          response="$(cat "$response_file")"
          if [[ "$http_code" != "200" ]] || [[ "$(jq -r '.success // false' <<<"$response")" != "true" ]]; then
            echo "::error::Cloudflare cache purge failed (HTTP $http_code). Check the dedicated token's Zone:Cache Purge permission."
            jq -c '{success,errors,messages}' <<<"$response" || true
            rm -f "$response_file"
            exit 1
          fi
          rm -f "$response_file"
          echo "Cloudflare HTML cache revalidation accepted."
