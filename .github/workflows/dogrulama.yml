# Yapılandırma doğrulaması.
#
# Neden gerekli: main dalına push, Cloudflare Workers Builds üzerinden DOĞRUDAN
# canlı siteyi günceller. Araya hiçbir onay adımı girmez. Bu iş akışı, siteyi
# sessizce bozan yapılandırma hatalarını birleşme öncesinde yakalar.
#
# ÖNEMLİ: Bu iş akışı tek başına deploy'u engelleyemez. Workers Builds, CI
# sonucuna bakmadan main'e gelen her push'u yayına alır. Gerçek kapı, GitHub
# tarafında "Require status checks to pass" ile kurulur.
# Adımlar: docs/ALAN-ADI-YAPILANDIRMA.md > GitHub tarafı.

name: Doğrulama

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dogrula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bu depoda package.json yok, npm kullanılmaz (AGENTS.md > Kod stili).
      # setup-node yalnızca sabit bir Node sürümü için var; bağımlılık kurulmaz.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript sözdizimi
        run: |
          # Worker sözdizimi hatası, deploy'u değil çalışma zamanını bozar:
          # site 500 döner. Bu yüzden push öncesi kontrol ediliyor.
          node --check src/worker.js
          node --check src/news-page.js
          for f in public/*.js; do node --check "$f"; done

      - name: Yapılandırma doğrulaması
        run: node tools/dogrula.mjs

      - name: Statik dosyalar public/ dışına taşmıyor
        run: |
          # public/ olduğu gibi servis edilir. wrangler.toml, src/ ve migrations/
          # oraya kopyalanırsa Worker kaynağı ve veritabanı şeması herkese açık
          # hale gelir.
          sizan=$(find public -maxdepth 2 \
            \( -name 'wrangler.toml' -o -name '*.sql' -o -name 'worker.js' \) -print)
          if [ -n "$sizan" ]; then
            echo "HATA  backend dosyası public/ altında:"
            echo "$sizan"
            exit 1
          fi
          echo "  ok  public/ altında backend dosyası yok."
