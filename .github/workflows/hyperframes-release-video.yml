name: BTMEDYA HyperFrames Release Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Videoda gösterilecek kısa başlık"
        required: false
        default: "BTMEDYA yeni üretim"
        type: string
  pull_request:
    branches: [main]
    paths:
      - "src/worker.js"
      - "video/hyperframes/**"
      - "tools/hyperframes-release.mjs"
      - ".github/workflows/hyperframes-release-video.yml"

permissions:
  contents: read

concurrency:
  group: btmedya-hyperframes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Prepare composition metadata
        env:
          BTMEDYA_VIDEO_TITLE: "BTMEDYA PR doğrulaması"
          BTMEDYA_COMMIT: ${{ github.event.pull_request.head.sha }}
          BTMEDYA_DATE: ${{ github.event.pull_request.updated_at }}
        run: node tools/hyperframes-release.mjs
      - name: Lint HyperFrames composition
        run: npx --yes hyperframes@latest lint video/hyperframes/release --json
      - name: Verify composition
        run: |
          set -euo pipefail
          test -s video/hyperframes/release/index.html
          grep -q 'data-composition-id="main"' video/hyperframes/release/index.html
          grep -q 'data-duration="8"' video/hyperframes/release/index.html

  render:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Prepare composition metadata
        env:
          BTMEDYA_VIDEO_TITLE: ${{ inputs.title || 'BTMEDYA yeni üretim' }}
          BTMEDYA_COMMIT: ${{ github.sha }}
          BTMEDYA_DATE: ${{ github.event.repository.updated_at }}
        run: node tools/hyperframes-release.mjs
      - name: Render MP4
        run: |
          set -euo pipefail
          npx --yes hyperframes@latest lint video/hyperframes/release --json
          mkdir -p artifacts
          npx --yes hyperframes@latest render -c video/hyperframes/release/index.html -o artifacts/btmedya-release.mp4
          test -s artifacts/btmedya-release.mp4
          file artifacts/btmedya-release.mp4
      - name: Save rendered video as a temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: btmedya-release-video-${{ github.sha }}
          path: artifacts/btmedya-release.mp4
          if-no-files-found: error
          retention-days: 14
