name: BTMEDYA Production Watch

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "src/**"
      - "wrangler.toml"
      - ".github/workflows/**"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btmedya-production-watch
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail

          base="https://btmedya.com.tr"
          www="https://www.btmedya.com.tr"

          check_code() {
            local url="$1"
            local expected="$2"
            local code
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 25 "$url" || true)"
            echo "$url -> $code"
            test "$code" = "$expected"
          }

          check_code "$base/" "200"
          check_code "$base/haberler/" "200"
          check_code "$base/kaynak-masasi/" "200"
          check_code "$base/robots.txt" "200"
          check_code "$base/sitemap.xml" "200"

          health="$(curl -fsS --max-time 25 "$base/api/health")"
          echo "health=$health"
          echo "$health" | grep -q '"ok":true'
          echo "$health" | grep -q '"cms":true'
          echo "$health" | grep -q '"r2":true'

          media="$(curl -fsS --max-time 25 "$base/api/public/media")"
          echo "$media" | grep -q '"items"'

          social="$(curl -fsS --max-time 25 "$base/api/public/social-feed")"
          echo "$social" | grep -q '"items"'

          admin_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "$base/api/admin/control-center" || true)"
          echo "admin unauthenticated -> $admin_code"
          test "$admin_code" = "401"

          www_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "$www/" || true)"
          echo "www -> $www_code"
          test "$www_code" = "301" || test "$www_code" = "308"

          echo "BTMEDYA production watch: PASS"
