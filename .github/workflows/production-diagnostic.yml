name: BTMedya production diagnostic

on:
  push:
    branches: ["main"]
    paths:
      - "wrangler.toml"
      - "migrations/**"
      - "control-plane/**"
      - "public/**"
      - ".github/workflows/production-diagnostic.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: btmedya-production-diagnostic
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 55874710e92e21e5d37bfa5f384e04bd

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN eksik."; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = "55874710e92e21e5d37bfa5f384e04bd" || { echo "Cloudflare account ID guard failed."; exit 1; }

      - name: Verify Wrangler configuration
        run: |
          set -eu
          grep -F 'account_id = "55874710e92e21e5d37bfa5f384e04bd"' wrangler.toml
          ! grep -F 'account_id = "b239acae17aebe894ea76309fe32cdce"' wrangler.toml

      - name: Verify authoritative DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          zone_json="$(curl -fsS "${api}/zones?name=btmedya.com.tr&status=active&per_page=10" "${auth[@]}")"
          test "$(jq -r '.success // false' <<<"$zone_json")" = "true"
          jq -r '.result[0].name_servers[]?' <<<"$zone_json" | sort -u

      - name: Run diagnostic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: |
          chmod +x control-plane/diagnose.sh
          ./control-plane/diagnose.sh

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: btmedya-production-diagnostic-${{ github.run_id }}
          path: btmedya-production-report.txt
          if-no-files-found: warn
          retention-days: 14
