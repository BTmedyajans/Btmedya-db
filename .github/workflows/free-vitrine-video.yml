name: BTMEDYA Free Vitrine Video

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * 1"
  push:
    branches: [main]
    paths:
      - "public/assets/media/**"
      - "public/assets/.pipeline-trigger"
      - "public/assets/haber-kapak/**"
      - "public/assets/logo/**"
      - "tools/build-free-vitrine-video.sh"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: btmedya-free-vitrine-video
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build free vitrine videos
        run: |
          chmod +x tools/build-free-vitrine-video.sh
          tools/build-free-vitrine-video.sh

      # Main is protected and requires signed commits. Submit generated outputs
      # through the repository's signed-commit PR action; never try an unsigned
      # direct push to main or report that an unconfigured Workers Builds path
      # will deploy them. Production goes live only after merge and the
      # canonical deploy-production.yml workflow passes.
      - name: Publish generated vitrine as a signed pull request
        uses: ./.github/actions/imzali-pr
        with:
          dal: automation/free-vitrine-video
          yollar: "public/assets/generated/*"
          mesaj: "chore: refresh free BTMEDYA vitrine videos"
          pr_baslik: "chore: refresh free BTMEDYA vitrine videos"
          pr_govde: |
            Generated desktop and mobile BTMEDYA showcase videos and poster.
            Review the generated assets before merging. The production deploy
            runs from main through deploy-production.yml after merge.
