name: repair-mobile-hero-branch
on:
  push:
    branches: [fix/mobile-hero-sahadan]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile video gate and source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/script.js')
          s=p.read_text(encoding='utf-8')
          old="""  const HEAVY_MEDIA_GATES=[\n    '(max-width: 720px)',\n    '(orientation: portrait) and (max-width: 1024px)',\n    '(orientation: portrait) and (pointer: coarse)',\n    '(orientation: landscape) and (pointer: coarse) and (max-height: 560px)',\n    '(prefers-reduced-motion: reduce)'\n  ];"""
          new="""  const HEAVY_MEDIA_GATES=[\n    '(prefers-reduced-motion: reduce)'\n  ];"""
          if old not in s:
              raise SystemExit('expected mobile gate not found')
          s=s.replace(old,new,1)
          s=s.replace("v.dataset.srcMobile","v.dataset.mobile",1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check public/script.js
      - name: Commit patch and remove bootstrap
        run: |
          git config user.name 'BTMEDYA Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-mobile-hero-branch.yml
          git add public/script.js
          git commit -m 'fix: restore mobile entrance film'
          git push origin HEAD:fix/mobile-hero-sahadan