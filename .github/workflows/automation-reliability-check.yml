name: BTMEDYA Automation Reliability Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "src/worker.js"
      - "src/autopilot.js"
      - "src/news-intelligence.js"
      - "wrangler.toml"
      - ".github/workflows/d1-migrations.yml"
      - ".github/workflows/automation-reliability-check.yml"
      - ".github/workflows/production-diagnostic.yml"
      - "migrations/**"
      - "tools/site-os-migration-test.py"
      - "control-plane/audit-d1-schema.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax checks
        run: |
          set -euo pipefail
          node --check src/worker.js
          node --check src/autopilot.js
          node --check src/news-intelligence.js
      - name: Validate production schema repair migrations against a drift fixture
        run: python3 tools/site-os-migration-test.py
      - name: Compile read-only production D1 audit
        run: python3 -m py_compile control-plane/audit-d1-schema.py
      - name: Reliability and migration guard checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Every run is finalized' src/autopilot.js
          grep -q 'runClaimed=Boolean(ins && Number(ins.meta?.changes)>0' src/autopilot.js
          grep -q 'recovery_note' src/autopilot.js
          grep -q 'Math.min(8,Math.max(4,Number(limit)||policy.maxItemsPerRun\*2))' src/autopilot.js
          grep -q 'Math.min(2,policy.maxItemsPerRun,Number(limit)||policy.maxItemsPerRun)' src/autopilot.js
          grep -q 'Math.min(2,hostList.length)' src/autopilot.js
          grep -q 'AbortSignal.timeout(6500)' src/autopilot.js
          grep -q 'feedBatchSize=6' src/news-intelligence.js
          grep -q 'Promise.all(activeFeeds.map' src/news-intelligence.js
          grep -q 'processCandidates=candidates.slice(0,12)' src/news-intelligence.js
          grep -q 'skipRecentIntelligence' src/autopilot.js
          grep -q 'cron==="\*/5 \* \* \* \*"' src/worker.js
          grep -q 'cron==="\*/15 \* \* \* \*"' src/worker.js
          grep -q 'cron==="0 5 \* \* \*"' src/worker.js
          grep -Fq 'crons = ["*/5 * * * *", "*/15 * * * *", "0 5 * * *"]' wrangler.toml
          ! grep -Eq '^  push:' .github/workflows/d1-migrations.yml
          grep -q 'APPLY_TO_REMOTE_D1' .github/workflows/d1-migrations.yml
          echo "AUTOMATION_RELIABILITY_GUARDS_PASS"
