name: BTMEDYA Core PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "migrations/**"
      - "tools/site-os-migration-test.py"
      - "tools/admin-giris-testi.mjs"
      - "tools/consent-gate-smoke.mjs"
      - "public/admin/agency-os/**"
      - "public/**"
      - "public/kategori-menu.js"
      - "public/data/youtube-portfoy.json"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Guard production deploy against implicit migrations
        run: |
          node - <<'NODE'
          const p = require('./package.json');
          const deploy = String(p.scripts?.deploy || '');
          if (/db:migrations:apply|d1 migrations apply/i.test(deploy)) {
            console.error('Production deploy must not apply D1 migrations automatically.');
            process.exit(1);
          }
          if (!/wrangler/.test(deploy) || !/deploy/.test(deploy)) {
            console.error('Expected the deploy script to invoke Wrangler.');
            process.exit(1);
          }
          console.log('PASS: production deploy does not run D1 migrations.');
          NODE
      - name: Node syntax
        run: |
          set -euo pipefail
          node --check src/worker.js
          node --check src/windsor-analytics.js
          node --check src/btmedya-core.js
          node --check src/metricool-scheduler.js
          node --check src/sosyal-otomasyon.js
          node --check src/kaynak-masasi.js
          node --check src/sosyal-dedupe.js
          node --check public/home.js
          node --check public/kategori-menu.js
          node --check public/admin/agency-os/agency-os.js
      - name: Consent-first analytics regression
        run: node tools/consent-gate-smoke.mjs
      - name: Admin login and static asset route regression
        run: node tools/admin-giris-testi.mjs
      - name: Site OS migration and taxonomy regression
        run: python3 tools/site-os-migration-test.py
      - name: Core wiring
        run: |
          grep -q 'btmedya-core' src/worker.js
          grep -q '/api/admin/core' src/btmedya-core.js
          grep -q '/api/admin/core' public/admin/agency-os/agency-os.js
