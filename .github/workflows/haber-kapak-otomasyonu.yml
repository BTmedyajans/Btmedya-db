name: BTMedya haber kapak otomasyonu

# Üretim zincirinin eksik halkası: Worker (Cloudflare) Python/Pillow
# çalıştıramadığı için Sabah Masası ve Autopilot otomatik yayınladığında
# haberin gerçek kapağı üretilemiyordu; kart genel kategori plakası
# gösteriyordu. Bu iş, canlı yayın akışından kapaksız haberleri bulur,
# gerçek rakamla kapak üretir ve main'e commit eder. Workers Builds dağıtınca
# kapakSec (src/worker.js) gerçek kapağı otomatik servis eder.
#
# Döngü yok: tetikleyici yalnız zamanlı (schedule) ve manuel (dispatch);
# push'la kendini tetiklemez. Yalnız public/assets/haber-kapak,
# public/assets/sosyal-kart, public/data/*.json ve Balıkesir haberleri için
# indirilen Commons yer fotoğraflarını (tools/temsili-kaynak) yazar.

on:
  schedule:
    # Sabah Masası 05:00 UTC (08:00 İstanbul) çalışır; sonrasında ve gün
    # içinde Autopilot yayınlarını yakalamak için 6 saatte bir süpürür.
    - cron: "40 5,11,17,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: btmedya-haber-kapak-otomasyonu
  cancel-in-progress: false

jobs:
  kapak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow kur
        run: python -m pip install --quiet "Pillow>=10,<12"

      - name: Kapaksız haberlere kapak üret
        run: python3 tools/kapak-otomasyonu.py

      - name: Asset referanslarını doğrula
        run: python3 tools/validate-assets.py

      # Yeni kapak dosyaları medya listesine girmezse PR doğrulaması
      # ("medya-listesi.json guncel degil") otomasyon PR'ını kırar.
      - name: Medya listesini güncelle
        run: node tools/medya-listesi.mjs

      # main korumalı (PR zorunlu + imzalı commit): doğrudan push reddedilir.
      # Koşucudaki `git push` da imzasız commit taşıdığı için kural setine
      # takılıyordu (11 Ekim). Kapaklar GitHub API ile imzalı commit olarak
      # dönen otomasyon dalına yazılır ve PR açılır; günlük süpervizör turu
      # açık otomasyon PR'ını birleştirir.
      - name: Üretilen kapakları PR olarak yayınla
        uses: ./.github/actions/imzali-pr
        with:
          dal: automation/haber-kapaklari
          yollar: public/assets/haber-kapak public/assets/sosyal-kart public/data/haber-kapak-plani.json public/data/haber-kapak-kaynagi.json public/data/kapak-foto-kaynaklari.json public/data/medya-listesi.json tools/temsili-kaynak
          mesaj: "chore: otomatik haber kapakları üretildi"
          pr_baslik: "chore: otomatik haber kapakları"
          pr_govde: "BTMEDYA haber kapak otomasyonu, kapaksız yayımlanan haberler için kapak üretti (vurgu rakamları yalnız haber metninden). main korumalı olduğu için doğrudan yazılmaz; bu PR süpervizör turu tarafından birleştirilir."
