name: BTMedya haber kapak otomasyonu

# Üretim zincirinin eksik halkası: Worker (Cloudflare) Python/Pillow
# çalıştıramadığı için Sabah Masası ve Autopilot otomatik yayınladığında
# haberin gerçek kapağı üretilemiyordu; kart genel kategori plakası
# gösteriyordu. Bu iş, canlı yayın akışından kapaksız haberleri bulur,
# gerçek rakamla kapak üretir ve main'e commit eder. Workers Builds dağıtınca
# kapakSec (src/worker.js) gerçek kapağı otomatik servis eder.
#
# Döngü yok: tetikleyici yalnız zamanlı (schedule) ve manuel (dispatch);
# push'la kendini tetiklemez. Yalnız public/assets/haber-kapak,
# public/assets/sosyal-kart, public/data/*.json ve Balıkesir haberleri için
# indirilen Commons yer fotoğraflarını (tools/temsili-kaynak) yazar.

on:
  schedule:
    # Sabah Masası 05:00 UTC (08:00 İstanbul) çalışır; sonrasında ve gün
    # içinde Autopilot yayınlarını yakalamak için 6 saatte bir süpürür.
    - cron: "40 5,11,17,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: btmedya-haber-kapak-otomasyonu
  cancel-in-progress: false

jobs:
  kapak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow kur
        run: python -m pip install --quiet "Pillow>=10,<12"

      - name: Kapaksız haberlere kapak üret
        run: python3 tools/kapak-otomasyonu.py

      - name: Asset referanslarını doğrula
        run: python3 tools/validate-assets.py

      # main korumalı (PR zorunlu + imzalı commit): doğrudan push reddedilir.
      # Kapaklar dönen bir otomasyon dalına yazılır ve PR açılır; squash
      # birleştirmede GitHub imzalı commit üretir. Günlük süpervizör turu
      # açık otomasyon PR'ını birleştirir (hero-video-quality ile aynı desen).
      - name: Üretilen kapakları PR olarak yayınla
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          YOLLAR="public/assets/haber-kapak public/assets/sosyal-kart public/data/haber-kapak-plani.json public/data/haber-kapak-kaynagi.json public/data/kapak-foto-kaynaklari.json tools/temsili-kaynak"
          if [ -z "$(git status --porcelain -- $YOLLAR)" ]; then
            echo "Üretilecek yeni kapak yok; akış güncel."
            exit 0
          fi
          git config user.name "BTMEDYA Kapak Otomasyonu"
          git config user.email "actions@users.noreply.github.com"
          DAL="automation/haber-kapaklari"
          git checkout -B "$DAL"
          git add $YOLLAR
          git commit -m "chore: otomatik haber kapakları üretildi"
          git push origin "HEAD:$DAL" --force
          PR="$(gh pr list --base main --head "$DAL" --state open --json number --jq '.[0].number')"
          if [ -z "$PR" ]; then
            gh pr create --base main --head "$DAL" \
              --title "chore: otomatik haber kapakları" \
              --body "BTMEDYA haber kapak otomasyonu, kapaksız yayımlanan haberler için kapak üretti (vurgu rakamları yalnız haber metninden). main korumalı olduğu için doğrudan yazılmaz; bu PR süpervizör turu tarafından birleştirilir." \
              || echo "::warning::PR açılamadı (Actions PR izni kapalı olabilir); kapaklar $DAL dalında hazır."
          else
            echo "Açık kapak PR'ı #$PR güncellendi."
          fi
