name: BTMedya haber kapak otomasyonu

# Kapaksız haberleri bulur, kapak üretir ve otomatik PR açar/günceller.
# PR açıldıktan sonra merge veya review beklemez; workflow başarıyla tamamlanır.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/haber-kapak-otomasyonu.yml"
      - "tools/kapak-otomasyonu.py"
      - "tools/validate-assets.py"
      - "tools/medya-listesi.mjs"
      - "public/data/**"
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: btmedya-haber-kapak-otomasyonu
  cancel-in-progress: false

env:
  AUTOMATION_BRANCH: automation/haber-kapaklari
  AUTOMATION_TOKEN: ${{ secrets.BTMEDYA_AUTOMATION_TOKEN || github.token }}

jobs:
  kapak:
    name: Kapakları üret ve PR aç
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow kurulumu
        run: python -m pip install --quiet "Pillow>=10,<12"

      - name: Kapaksız haberlere kapak üret
        run: python3 tools/kapak-otomasyonu.py

      - name: Asset referanslarını doğrula
        run: python3 tools/validate-assets.py --allow-generated-hero

      - name: Medya listesini güncelle
        run: node tools/medya-listesi.mjs

      - name: GitHub token erişimini doğrula
        env:
          GH_TOKEN: ${{ env.AUTOMATION_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          repo_json="$(gh api "repos/$GH_REPO")"
          test "$(jq -r '.full_name' <<<"$repo_json")" = "$GH_REPO"
          echo "GitHub API erişimi doğrulandı; token değeri loglanmadı."

      - name: Otomatik PR oluştur veya güncelle
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ env.AUTOMATION_TOKEN }}
          branch: ${{ env.AUTOMATION_BRANCH }}
          base: main
          delete-branch: false
          draft: false
          title: "chore: otomatik haber kapakları"
          commit-message: "chore: otomatik haber kapakları üretildi"
          body: |
            BTMEDYA haber kapak otomasyonu tarafından oluşturuldu.

            Bu workflow PR'ı oluşturur veya mevcut PR'ı günceller; merge ya da review beklemez.
          add-paths: |
            public/assets/haber-kapak/**
            public/assets/sosyal-kart/**
            public/data/haber-kapak-plani.json
            public/data/haber-kapak-kaynagi.json
            public/data/kapak-foto-kaynaklari.json
            public/data/medya-listesi.json
            tools/temsili-kaynak/**

      - name: PR sonucunu bildir
        if: steps.pr.outputs.pull-request-number != ''
        run: |
          echo "PR #${{ steps.pr.outputs.pull-request-number }} hazır."
          echo "URL: ${{ steps.pr.outputs.pull-request-url }}"
          echo "Merge beklenmeden workflow tamamlandı."
