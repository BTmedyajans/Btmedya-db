name: One-time security hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Protect media vault mutations
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/worker.js")
          s = p.read_text()

          anchor = "  const auth=aiRead || await validSession(request,oturumAnahtari(env));\n"
          guard = "  if(!auth) return json({error:'Yetkisiz'},401);\n"

          if guard in s:
              print("Media API authorization guard already present.")
          elif anchor not in s:
              raise SystemExit("Media API authorization anchor not found; refusing unsafe edit.")
          else:
              s = s.replace(anchor, anchor + guard, 1)
              p.write_text(s)
              print("Inserted authorization guard for all protected media-vault endpoints.")
          PY

          node --check src/worker.js

      - name: Commit hardening
        run: |
          set -eu
          if git diff --quiet -- src/worker.js; then
            echo "No change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.js
          git commit -m "fix(security): protect media vault mutations"
          git push origin HEAD:main

      - name: Remove one-time workflow
        run: |
          set -eu
          rm -f .github/workflows/security-hardening-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/security-hardening-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(ci): remove one-time security hardening workflow"
          git push origin HEAD:main
