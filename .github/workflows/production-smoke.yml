name: BTMEDYA production smoke test

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Cloudflare administration"]
    types: [completed]
  workflow_dispatch:

jobs:
  smoke:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check production homepage
        run: |
          set -euo pipefail
          curl -sSIL --max-time 20 https://btmedya.com.tr/ | tee /tmp/home.headers
          code="$(awk 'NR==1 {print $2}' /tmp/home.headers)"
          test "$code" = "200"

      - name: Check crawl discovery files
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://btmedya.com.tr/robots.txt | tee /tmp/robots.txt
          grep -Fq 'Allow: /' /tmp/robots.txt
          grep -Fq 'Disallow: /admin/' /tmp/robots.txt
          grep -Fq 'Sitemap: https://btmedya.com.tr/sitemap.xml' /tmp/robots.txt
          curl -fsS --max-time 20 https://btmedya.com.tr/sitemap.xml > /tmp/sitemap.xml
          grep -Fq '<urlset' /tmp/sitemap.xml
          grep -Fq 'https://btmedya.com.tr/' /tmp/sitemap.xml

      - name: Check homepage indexing signals
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://btmedya.com.tr/ > /tmp/home.html
          grep -Fq 'rel="canonical" href="https://btmedya.com.tr/"' /tmp/home.html
          grep -Fq 'name="robots" content="index,follow' /tmp/home.html
          ! grep -Eiq 'name="robots"[^>]+content="[^"]*noindex' /tmp/home.html
          grep -Fq '"@type":"NewsMediaOrganization"' /tmp/home.html
          grep -Fq '"@type":"WebSite"' /tmp/home.html
          grep -Fq 'twitter:card' /tmp/home.html
          grep -Fq 'og:image' /tmp/home.html

      - name: Check current homepage assets and structure
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://btmedya.com.tr/ > /tmp/home.html
          grep -Fq '/assets/media/web/hero-story.mp4' /tmp/home.html
          grep -Fq 'NEWSROOM' /tmp/home.html
          grep -Fq 'AI LAB' /tmp/home.html
          grep -Fq 'Media Vault' /tmp/home.html
          grep -Fq 'WhatsApp' /tmp/home.html
          grep -Fq 'home.js' /tmp/home.html
          grep -Fq 'mobile-fixes.css' /tmp/home.html
          grep -Fq 'Balıkesir Haber, Medya, Prodüksiyon ve AI' /tmp/home.html
          grep -Fq 'name="robots" content="index,follow' /tmp/home.html
          grep -Fq 'rel="manifest" href="/site.webmanifest"' /tmp/home.html
          grep -Fq '"@type":"WebPage"' /tmp/home.html
          grep -Fq '/haberler/karesi-kocaavsar-orman-yangini-kontrol-altina-alindi' /tmp/home.html
          curl -fsS --max-time 20 https://btmedya.com.tr/haberler/karesi-kocaavsar-orman-yangini-kontrol-altina-alindi > /tmp/article.html
          grep -Fq '"@type":"NewsArticle"' /tmp/article.html
          grep -Fq '"@type":"BreadcrumbList"' /tmp/article.html
          grep -Fq 'rel="canonical"' /tmp/article.html

      - name: Check public media API
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://btmedya.com.tr/api/public/media > /tmp/media.json
          node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!Array.isArray(x.items)||x.items.length<1) process.exit(1); if(typeof x.source!=="string") process.exit(1)' /tmp/media.json

      - name: Check production API health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            headers=/tmp/health.headers
            body=/tmp/health.json
            code="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' --max-time 20 https://btmedya.com.tr/api/health || true)"
            if [ "$code" = "200" ]; then
              cat "$body"
              node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!x.ok||x.service!=="btmedya") process.exit(1)' "$body"
              exit 0
            fi
            echo "API health HTTP $code; deneme ${attempt}/20."
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "--- Response headers ---"
              cat "$headers"
              echo "--- Response body (first 40 lines) ---"
              sed -n '1,40p' "$body" || true
              echo "Cloudflare Access/WAF may be blocking the public Worker before application code. Check Zero Trust Access, SAML/IdP policy and Security Events."
              exit 1
            fi
            sleep 15
          done
          echo "Production API health 5 dakika içinde hazır olmadı."
          exit 1

      - name: Check admin protection
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://btmedya.com.tr/api/admin/news)"
          # 3xx = edge auth redirect; 401/403/404/405 = protected/hidden endpoint.
          # A 2xx response would mean the admin API is publicly reachable and must fail the smoke test.
          case "$status" in
            301|302|303|307|308|401|403|404|405) ;;
            2*) echo "Admin API unexpectedly public: HTTP $status"; exit 1 ;;
            *) echo "Admin API returned unexpected HTTP $status"; exit 1 ;;
          esac

      - name: Check WWW canonical redirect
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://www.btmedya.com.tr/)"
          location="$(curl -sSI --max-time 20 https://www.btmedya.com.tr/ | awk 'BEGIN{IGNORECASE=1} /^location:/ {print $2}' | tr -d '\r')"
          test "$status" = "301"
          test "$location" = "https://btmedya.com.tr/"
