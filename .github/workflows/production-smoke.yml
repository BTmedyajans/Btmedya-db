name: BTMEDYA production smoke test

on:
  workflow_run:
    workflows: ["Cloudflare administration"]
    types: [completed]
  workflow_dispatch:

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check production homepage
        run: |
          set -euo pipefail
          curl -sSIL --max-time 20 https://btmedya.com.tr/ | tee /tmp/home.headers
          code="$(awk 'NR==1 {print $2}' /tmp/home.headers)"
          test "$code" = "200"

      - name: Check crawl discovery files
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://btmedya.com.tr/robots.txt | tee /tmp/robots.txt
          grep -Fq 'Allow: /' /tmp/robots.txt
          grep -Fq 'Disallow: /admin/' /tmp/robots.txt
          grep -Fq 'Sitemap: https://btmedya.com.tr/sitemap.xml' /tmp/robots.txt
          curl -fsS --max-time 20 https://btmedya.com.tr/sitemap.xml > /tmp/sitemap.xml
          grep -Fq '<urlset' /tmp/sitemap.xml
          grep -Fq 'https://btmedya.com.tr/' /tmp/sitemap.xml

      - name: Check homepage indexing signals
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://btmedya.com.tr/ > /tmp/home.html
          grep -Fq 'rel="canonical" href="https://btmedya.com.tr/"' /tmp/home.html
          grep -Fq 'name="robots" content="index,follow,max-image-preview:large"' /tmp/home.html
          ! grep -Eiq 'name="robots"[^>]+content="[^"]*noindex' /tmp/home.html
          grep -Fq '"@type":"NewsMediaOrganization"' /tmp/home.html
          grep -Fq '"@type":"WebSite"' /tmp/home.html

      - name: Check core static assets
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://btmedya.com.tr/anasayfa.css > /tmp/home.css
          curl -fsS --max-time 20 https://btmedya.com.tr/anasayfa.js > /tmp/home.js
          curl -fsS --max-time 20 https://btmedya.com.tr/site.webmanifest > /tmp/manifest.json
          grep -Fq 'kadraj' /tmp/home.js
          grep -Fq '"short_name":"BTMEDYA"' /tmp/manifest.json

      - name: Check production API health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            headers=/tmp/health.headers
            body=/tmp/health.json
            code="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' --max-time 20 https://btmedya.com.tr/api/health || true)"
            if [ "$code" = "200" ]; then
              cat "$body"
              node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!x.ok||x.service!=="btmedya") process.exit(1)' "$body"
              exit 0
            fi
            echo "API health HTTP $code; deneme ${attempt}/20."
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "--- Response headers ---"
              cat "$headers"
              echo "--- Response body (first 40 lines) ---"
              sed -n '1,40p' "$body" || true
              echo "Cloudflare Access/WAF may be blocking the public Worker before application code. Check Zero Trust Access, SAML/IdP policy and Security Events."
              exit 1
            fi
            sleep 15
          done
          echo "Production API health 5 dakika içinde hazır olmadı."
          exit 1

      - name: Check admin protection
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://btmedya.com.tr/api/admin/news)"
          test "$status" = "401"

      - name: Check WWW canonical redirect
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://www.btmedya.com.tr/"
          location="$(curl -sSI --max-time 20 https://www.btmedya.com.tr/ | awk 'BEGIN{IGNORECASE=1} /^location:/ {print $2}' | tr -d '\r')"
          test "$status" = "301"
          test "$location" = "https://btmedya.com.tr/"
