name: BTMEDYA D1 Migrations

on:
  # Remote schema changes are intentionally manual until the live migration
  # ledger and schema have been reconciled. Never migrate production on push.
  workflow_dispatch:
    inputs:
      confirm_backup:
        description: "Type BACKUP_VERIFIED only after a recoverable D1 backup exists"
        required: true
        type: string
      confirm_staging:
        description: "Type STAGING_VERIFIED only after pending migrations passed on staging"
        required: true
        type: string
      confirm_apply:
        description: "Type APPLY_TO_REMOTE_D1 to explicitly authorize the remote migration"
        required: true
        type: string

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: b239acae17aebe894ea76309fe32cdce

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit production migration confirmation
        shell: bash
        env:
          CONFIRM_BACKUP: ${{ inputs.confirm_backup }}
          CONFIRM_STAGING: ${{ inputs.confirm_staging }}
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_BACKUP" != "BACKUP_VERIFIED" ] || [ "$CONFIRM_STAGING" != "STAGING_VERIFIED" ] || [ "$CONFIRM_APPLY" != "APPLY_TO_REMOTE_D1" ]; then
            echo "::error::Production D1 migration stopped. Require verified backup, successful staging rehearsal, and explicit apply confirmation."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply remote D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.BTMEDYA_DB1 || secrets.BTMEDYA_D1 }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.142.0"
          command: d1 migrations apply btmedya-media --remote --config wrangler.toml
