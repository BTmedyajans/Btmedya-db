name: BTMEDYA D1 Migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - ".github/workflows/d1-migrations.yml"

permissions:
  contents: read

env:
  # Shared credential chain: prefer the dedicated deploy token, then the existing broad API token.
  CLOUDFLARE_ACCOUNT_ID: b239acae17aebe894ea76309fe32cdce

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply remote D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          command: d1 migrations apply btmedya-media --remote --config wrangler.toml
