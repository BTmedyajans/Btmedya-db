name: BTMEDYA D1 Migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - ".github/workflows/d1-migrations.yml"

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply remote D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: latest
          command: d1 migrations apply btmedya-media --remote --config wrangler.toml
