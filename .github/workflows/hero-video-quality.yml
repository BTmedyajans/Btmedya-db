name: BTMEDYA Hero Video Quality

on:
  push:
    branches: [main]
    paths:
      - "tools/giris-filmi/video-quality-pass.sh"
      - "public/index.html"
      - "public/hero-sequence-v2.js"
      - "public/mobile-motion.js"
      - "public/hero-video-quality-v1.css"
      - ".github/workflows/hero-video-quality.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: btmedya-hero-video-quality
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Align with latest main before generating binaries
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build HQ hero video variants
        run: |
          chmod +x tools/giris-filmi/video-quality-pass.sh
          tools/giris-filmi/video-quality-pass.sh
          test -s public/assets/media/web/giris-filmi-genis-hq.mp4
          test -s public/assets/media/web/giris-filmi-genis-hq.webm
          test -s public/assets/media/web/giris-filmi-genis-hq-poster.jpg
          test -s public/assets/media/web/giris-filmi-hq.mp4
          test -s public/assets/media/web/giris-filmi-hq.webm
          test -s public/assets/media/web/giris-filmi-hq-poster.jpg

      - name: Publish generated HQ video variants as a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- public/assets/media/web/*-hq.*)" ]; then
            echo "No generated HQ media changes."
            exit 0
          fi
          git config user.name "BTMEDYA Hero Video Builder"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="automation/hero-video-quality"
          git checkout -B "$BRANCH"
          git add public/assets/media/web/*-hq.*
          git commit -m "chore: refresh hero video HQ variants"
          git push origin "HEAD:$BRANCH" --force
          PR_NUMBER="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq ".[0].number")"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --base main --head "$BRANCH" --title "chore: refresh hero video HQ variants" --body "Generated by the BTMEDYA Hero Video Quality workflow. This workflow intentionally opens a PR instead of writing directly to protected main."
          else
            echo "Existing hero quality PR #$PR_NUMBER updated."
          fi
