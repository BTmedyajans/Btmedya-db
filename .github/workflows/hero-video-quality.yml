name: BTMEDYA Hero Video Quality

# Yalnız elle: ana sayfa artık btmedya-tanitim-v5 filmini oynatıyor; bu
# işin ürettiği giris-filmi*-hq / giris-ai*-hq dosyaları sitede kullanılmıyor.
# Her index.html değişikliğinde tetiklenip kullanılmayan video üretmesi ve
# imzasız push yüzünden kırmızı düşmesi gürültüydü (11 Ekim).
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: btmedya-hero-video-quality
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Align with latest main before generating binaries
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build HQ hero video variants
        run: |
          chmod +x tools/giris-filmi/video-quality-pass.sh
          tools/giris-filmi/video-quality-pass.sh
          test -s public/assets/media/web/giris-filmi-genis-hq.mp4
          test -s public/assets/media/web/giris-filmi-genis-hq.webm
          test -s public/assets/media/web/giris-filmi-genis-hq-poster.jpg
          test -s public/assets/media/web/giris-filmi-hq.mp4
          test -s public/assets/media/web/giris-filmi-hq.webm
          test -s public/assets/media/web/giris-filmi-hq-poster.jpg

      - name: Publish generated HQ video variants as a pull request
        uses: ./.github/actions/imzali-pr
        with:
          dal: automation/hero-video-quality
          token: ${{ secrets.BTMEDYA_AUTOMATION_TOKEN }}
          publish_repo: busetuncay1029-ai/Btmedya-db
          yollar: "public/assets/media/web/*-hq.*"
          mesaj: "chore: refresh hero video HQ variants"
          pr_govde: "Generated by the BTMEDYA Hero Video Quality workflow (silent, -an). This workflow opens a PR with an API-signed commit instead of writing to protected main."
