name: BTMedya dagitim gecikmesi

# Neden ayri bir is akisi?
#
# 23 Eylul 2026'da iki birlestirme bos commit olarak dustu, icerikleri main'e
# hic ulasmadi. 24 Eylul'de ise icerik main'e ulasti ama Cloudflare derlemesi
# 35 dakika surdu. Ikisi de "canlidaki site main ile ayni mi?" sorusuyla
# yakalanir; push anindaki smoke testi ise birkac dakika bekleyip birakmak
# zorunda, yoksa her birlestirmede runner dakikasi yakar.
#
# Bu is akisi yarim saatte bir sorar ve yalnizca gecikme gercekten uzunsa
# (main'in son commit'i bir saati gecmisse) kirmizi verir. Boylece kuyrukta
# bekleyen normal bir dagitim alarm uretmez, takilan bir dagitim gorunur olur.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btmedya-dagitim-gecikmesi
  cancel-in-progress: true

jobs:
  gecikme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Canli surum main ile ayni mi
        run: |
          set -eu
          ozet() { sha256sum "public/$1" | cut -c1-64; }
          canli() { curl -fsS --max-time 20 "https://btmedya.com.tr/$1" 2>/dev/null | sha256sum | cut -c1-64; }

          eksik=""
          for f in home.css home.js styles.css; do
            a="$(ozet "$f")"; b="$(canli "$f")"
            if [ "$a" = "$b" ]; then
              echo "  $f guncel"
            else
              echo "  $f ESKI  depo=$a canli=$b"
              eksik="$eksik $f"
            fi
          done

          if [ -z "$eksik" ]; then
            echo "Canli surum main ile ayni."
            exit 0
          fi

          # Ne kadardir bekliyor? main'in son commit zamanina bakilir.
          simdi="$(date -u +%s)"
          commit="$(git log -1 --format=%ct)"
          dakika=$(( (simdi - commit) / 60 ))
          echo "main'in son commit'i $dakika dakika once."

          if [ "$dakika" -lt 60 ]; then
            echo "::notice::Dagitim henuz inmedi ama commit $dakika dakikalik; kuyrukta olabilir."
            exit 0
          fi

          echo "::error::Canli surum $dakika dakikadir main'in gerisinde:$eksik"
          echo "Cloudflare panelinden Workers & Pages > btmedya-db > Builds'e bakin."
          exit 1
