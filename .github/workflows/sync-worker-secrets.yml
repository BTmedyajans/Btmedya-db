# Supervisor reconciliation trigger: 2026-10-12 — reconcile all configured admin integration secrets from GitHub to the Worker.
name: BTMEDYA Sync Worker Secrets
# Secret-binding repair trigger: keep Worker sensitive bindings encrypted and reconciled from GitHub Secrets.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-worker-secrets.yml"
      - "wrangler.toml"
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "Güncellenecek secret grubu"
        required: true
        type: choice
        options: [core, recovery, ai, all, windsor, meta, tiktok, youtube, x, native-social, social-key-rotate, buffer]
        default: core

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate the single Cloudflare Worker token
        id: preflight
        shell: bash
        env:
          CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CF_ACCOUNT_ID: b239acae17aebe894ea76309fe32cdce
          GH_EVENT: ${{ github.event_name }}
          SCOPE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || '' }}
        run: |
          set -euo pipefail
          if [ -z "${CF_DEPLOY_TOKEN:-}" ]; then
            if [ "$GH_EVENT" = "workflow_dispatch" ]; then
              echo "::error::GitHub Actions secret CLOUDFLARE_DEPLOY_TOKEN is required to sync Worker secrets."
              exit 1
            fi
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_DEPLOY_TOKEN missing; scheduled/push secret sync was safely skipped."
            exit 0
          fi
          echo "::add-mask::$CF_DEPLOY_TOKEN"
          # First check a user-scoped token, then the account-token endpoint.
          verify="$(curl -sS --connect-timeout 10 --max-time 20 -H "Authorization: Bearer $CF_DEPLOY_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify || true)"
          state="$(jq -r '.result.status // empty' <<<"$verify" 2>/dev/null || true)"
          if [ "$state" != "active" ]; then
            verify="$(curl -sS --connect-timeout 10 --max-time 20 -H "Authorization: Bearer $CF_DEPLOY_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/tokens/verify" || true)"
            state="$(jq -r '.result.status // empty' <<<"$verify" 2>/dev/null || true)"
          fi
          if [ "$state" != "active" ]; then
            if [ "$GH_EVENT" = "workflow_dispatch" ]; then
              echo "::error::CLOUDFLARE_DEPLOY_TOKEN failed both user-scoped and account-scoped token verification. Re-save the complete token value or check that the Cloudflare token is active."
              exit 1
            fi
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_DEPLOY_TOKEN failed user and account token verification; scheduled/push secret sync was safely skipped."
            exit 0
          fi
          access_file="$(mktemp)"
          http_code="$(curl -sS --connect-timeout 10 --max-time 20 -o "$access_file" -w "%{http_code}" -H "Authorization: Bearer $CF_DEPLOY_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts")"
          if [ "$http_code" != "200" ] || ! jq -e --arg worker "btmedya-db" '.success == true and any(.result[]?; .id == $worker)' "$access_file" >/dev/null 2>&1; then
            rm -f "$access_file"
            if [ "$GH_EVENT" = "workflow_dispatch" ]; then
              echo "::error::Active token cannot access Worker btmedya-db. Grant Workers Editor for this Worker or Workers product scope."
              exit 1
            fi
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Token cannot access btmedya-db; scheduled/push secret sync was safely skipped."
            exit 0
          fi
          rm -f "$access_file"
          echo "CLOUDFLARE_API_TOKEN=$CF_DEPLOY_TOKEN" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "One active token can access the target Worker; Wrangler will enforce write permission for secret updates."

      - name: Install current Wrangler
        if: steps.preflight.outputs.configured == 'true'
        run: npm install --no-save --no-package-lock wrangler@4.142.0

      - name: Sync Worker secrets
        if: steps.preflight.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          ADMIN_PASSWORD_SECRET: ${{ secrets.BTMEDYA_ADMIN_PASSWORD_SECRET }}
          ADMIN_SESSION_SECRET_SECRET: ${{ secrets.BTMEDYA_ADMIN_SESSION_SECRET_SECRET }}
          MEDIA_SIGNING_SECRET: ${{ secrets.BTMEDYA_MEDIA_SIGNING_SECRET }}
          RESEND_API_KEY: ${{ secrets.BTMEDYA_RESEND_API_KEY }}
          RESEND_TO: ${{ secrets.BTMEDYA_RESEND_TO }}
          RESEND_FROM: ${{ secrets.BTMEDYA_RESEND_FROM }}
          OPENAI_API_KEY: ${{ secrets.BTMEDYA_OPENAI_API_KEY }}
          ADMIN_RECOVERY_SECRET: ${{ secrets.BTMEDYA_ADMIN_RECOVERY_SECRET }}
          BUFFER_API_KEY: ${{ secrets.BTMEDYA_BUFFER_API_KEY }}
          WINDSOR_API_KEY: ${{ secrets.BTMEDYA_WINDSOR_API_KEY }}
          META_APP_ID: ${{ secrets.BTMEDYA_META_APP_ID }}
          META_APP_SECRET: ${{ secrets.BTMEDYA_META_APP_SECRET }}
          SOCIAL_TOKEN_ENCRYPTION_KEY: ${{ secrets.BTMEDYA_SOCIAL_TOKEN_ENCRYPTION_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.BTMEDYA_TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.BTMEDYA_TIKTOK_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.BTMEDYA_YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.BTMEDYA_YOUTUBE_CLIENT_SECRET }}
          X_CLIENT_ID: ${{ secrets.BTMEDYA_X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.BTMEDYA_X_CLIENT_SECRET }}
          SCOPE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || '' }}
        run: |
          set -euo pipefail
          require_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Gerekli GitHub secret eksik: $name"
              exit 1
            fi
          }

          # Scheduled/push runs repair missing secret bindings but never rewrite
          # values that already exist. Provider sync scopes update app credentials,
          # but intentionally exclude SOCIAL_TOKEN_ENCRYPTION_KEY: replacing it
          # can make previously encrypted OAuth tokens unreadable. A deliberate
          # key change must use the dedicated social-key-rotate scope.
          FORCE_SYNC=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            SCOPE="${SCOPE_INPUT:-core}"
            FORCE_SYNC=true
          else
            SCOPE="all"
          fi

          STRICT_CORE=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            case "$SCOPE" in
              core|all) STRICT_CORE=true ;;
            esac
          fi

          case "$SCOPE" in
            recovery) GROUP_NAMES=(ADMIN_RECOVERY_SECRET) ;;
            core)
              GROUP_NAMES=(ADMIN_PASSWORD_SECRET ADMIN_SESSION_SECRET_SECRET MEDIA_SIGNING_SECRET RESEND_API_KEY RESEND_TO RESEND_FROM)
              ;;
            ai) GROUP_NAMES=(OPENAI_API_KEY) ;;
            windsor) GROUP_NAMES=(WINDSOR_API_KEY) ;;
            meta) GROUP_NAMES=(META_APP_ID META_APP_SECRET) ;;
            tiktok) GROUP_NAMES=(TIKTOK_CLIENT_KEY TIKTOK_CLIENT_SECRET) ;;
            youtube) GROUP_NAMES=(YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET) ;;
            x) GROUP_NAMES=(X_CLIENT_ID X_CLIENT_SECRET) ;;
            social-key-rotate) GROUP_NAMES=(SOCIAL_TOKEN_ENCRYPTION_KEY) ;;
            buffer) GROUP_NAMES=(BUFFER_API_KEY) ;;
            native-social)
              GROUP_NAMES=(META_APP_ID META_APP_SECRET SOCIAL_TOKEN_ENCRYPTION_KEY TIKTOK_CLIENT_KEY TIKTOK_CLIENT_SECRET YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET X_CLIENT_ID X_CLIENT_SECRET)
              ;;
            all)
              GROUP_NAMES=(ADMIN_PASSWORD_SECRET ADMIN_SESSION_SECRET_SECRET MEDIA_SIGNING_SECRET RESEND_API_KEY RESEND_TO RESEND_FROM OPENAI_API_KEY BUFFER_API_KEY WINDSOR_API_KEY META_APP_ID META_APP_SECRET TIKTOK_CLIENT_KEY TIKTOK_CLIENT_SECRET YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET X_CLIENT_ID X_CLIENT_SECRET)
              ;;
            *) echo "Geçersiz scope: $SCOPE" >&2; exit 1 ;;
          esac

          if [ "$STRICT_CORE" = "true" ]; then
            case "$SCOPE" in
              core|all)
                require_secret ADMIN_PASSWORD_SECRET
                require_secret ADMIN_SESSION_SECRET_SECRET
                require_secret MEDIA_SIGNING_SECRET
                ;;
            esac
          fi
          # Manual provider-specific syncs must fail with the exact missing secret name
          # instead of reporting a successful no-op when a repository secret is absent.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            case "$SCOPE" in
              meta|tiktok|youtube|x|native-social|social-key-rotate)
                for name in "${GROUP_NAMES[@]}"; do require_secret "$name"; done
                ;;
            esac
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$SCOPE" = "buffer" ]; then
            require_secret BUFFER_API_KEY
          fi

          echo "SYNC_SCOPE=$SCOPE FORCE_SYNC=$FORCE_SYNC"

          # Wrangler returns secret names/types only. Never print or persist values
          # in a workflow log; the JSON payload is created with restrictive mode.
          CURRENT_SECRET_NAMES="$(npx wrangler secret list --name btmedya-db --config wrangler.toml | jq -r '.[].name')"
          export CURRENT_SECRET_NAMES
          VALUES_FILE="$(mktemp)"
          chmod 600 "$VALUES_FILE"
          trap 'rm -f "$VALUES_FILE"' EXIT

          python3 - "$VALUES_FILE" "$FORCE_SYNC" "${GROUP_NAMES[@]}" <<'PY'
          import json, os, sys
          path, force, *names = sys.argv[1:]
          current = set(os.environ.get("CURRENT_SECRET_NAMES", "").splitlines())
          payload = {}
          skipped_existing = []
          skipped_missing = []
          for name in names:
              value = os.environ.get(name, "")
              if not value:
                  skipped_missing.append(name)
                  continue
              if force != "true" and name in current:
                  skipped_existing.append(name)
                  continue
              payload[name] = value
          with open(path, "w", encoding="utf-8") as f:
              json.dump(payload, f)
          os.chmod(path, 0o600)
          print("SECRET_PLAN update_count=" + str(len(payload)))
          if skipped_existing:
              print("SECRET_PLAN already_bound_skipped=" + ",".join(skipped_existing))
          if skipped_missing:
              print("SECRET_PLAN github_secret_missing_skipped=" + ",".join(skipped_missing))
          print("SECRET_PLAN values_hidden=true")
          PY

          if [ "$(jq 'length' "$VALUES_FILE")" -gt 0 ]; then
            # One bulk update creates a single Worker version instead of deploying
            # once for each secret key.
            npx wrangler secret bulk "$VALUES_FILE" --name btmedya-db --config wrangler.toml
            echo "Secret binding update completed (values hidden)."
          else
            echo "No secret binding changes required; active values were left untouched."
          fi

      - name: Verify Windsor.ai API key
        if: steps.preflight.outputs.configured == 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.scope == 'windsor' || inputs.scope == 'all')
        env:
          WINDSOR_API_KEY: ${{ secrets.BTMEDYA_WINDSOR_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$WINDSOR_API_KEY" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${SCOPE_INPUT:-}" = "windsor" ]; then
              echo "::error::Windsor aktarımı istendi ancak BTMEDYA_WINDSOR_API_KEY GitHub Secret'ı eksik."
              exit 1
            fi
            echo "::warning::Windsor.ai anahtarı BTMEDYA_WINDSOR_API_KEY secret'ında yok; Worker'a aktarım atlandı."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          params=urllib.parse.urlencode({"api_key":os.environ["WINDSOR_API_KEY"]})
          request=urllib.request.Request(
              "https://connectors.windsor.ai/list_connectors?"+params,
              headers={"Accept":"application/json","User-Agent":"BTMEDYA-Windsor-Secret-Check/1.0"}
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  data=json.loads(response.read().decode("utf-8"))
                  if response.status != 200 or not isinstance(data, (list, dict)):
                      raise SystemExit("FAIL Windsor.ai API yanıtı doğrulanamadı")
          except Exception:
              raise SystemExit("FAIL Windsor.ai API anahtarı veya API erişimi doğrulanamadı; anahtar değeri loglanmadı")
          print("OK Windsor.ai API key validated (value hidden)")
          PY
