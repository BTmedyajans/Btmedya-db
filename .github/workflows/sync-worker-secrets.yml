# Supervisor reconciliation trigger: 2026-10-06 — reconcile Metricool + admin secret bindings.
name: BTMEDYA Sync Worker Secrets
# Secret-binding repair trigger: keep Worker sensitive bindings encrypted and reconciled from GitHub Secrets.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-worker-secrets.yml"
      - "wrangler.toml"
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "Güncellenecek secret grubu"
        required: true
        type: choice
        options: [core, recovery, ai, all, metricool, windsor]
        default: core

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cloudflare credential preflight
        id: preflight
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare bağlantısı mevcut; Worker secret senkronizasyonu çalışacak."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare kimlik bilgileri henüz bağlı değil; senkronizasyon güvenle atlandı."
          fi

      - name: Install current Wrangler
        if: steps.preflight.outputs.configured == 'true'
        run: npm install --no-save --no-package-lock wrangler@4.142.0

      - name: Sync Worker secrets
        if: steps.preflight.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PASSWORD_SECRET: ${{ secrets.BTMEDYA_ADMIN_PASSWORD_SECRET }}
          ADMIN_SESSION_SECRET_SECRET: ${{ secrets.BTMEDYA_ADMIN_SESSION_SECRET_SECRET }}
          MEDIA_SIGNING_SECRET: ${{ secrets.BTMEDYA_MEDIA_SIGNING_SECRET }}
          RESEND_API_KEY: ${{ secrets.BTMEDYA_RESEND_API_KEY }}
          RESEND_TO: ${{ secrets.BTMEDYA_RESEND_TO }}
          RESEND_FROM: ${{ secrets.BTMEDYA_RESEND_FROM }}
          OPENAI_API_KEY: ${{ secrets.BTMEDYA_OPENAI_API_KEY }}
          ADMIN_RECOVERY_SECRET: ${{ secrets.BTMEDYA_ADMIN_RECOVERY_SECRET }}
          METRICOOL_USER_TOKEN: ${{ secrets.BTMEDYA_METRICOOL_USER_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.BTMEDYA_METRICOOL_USER_ID }}
          METRICOOL_BRAND_ID: ${{ secrets.BTMEDYA_METRICOOL_BRAND_ID }}
          WINDSOR_API_KEY: ${{ secrets.BTMEDYA_WINDSOR_API_KEY }}
          SCOPE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || '' }}
        run: |
          set -euo pipefail
          require_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Gerekli GitHub secret eksik: $name"
              exit 1
            fi
          }

          put_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -z "$value" ]; then
              echo "SKIP $name (GitHub secret tanımlı değil)"
              return 0
            fi
            printf '%s' "$value" | npx wrangler secret put "$name" --name btmedya-db --config wrangler.toml
            echo "UPDATED $name"
          }

          STRICT_CORE=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            SCOPE="${SCOPE_INPUT:-core}"
            case "$SCOPE" in
              core|all) STRICT_CORE=true ;;
            esac
          else
            # Push/schedule mevcut canlı secret'ları güvenle uzlaştırır.
            # GitHub'daki opsiyonel secret eksikse atlanır; canlı Worker
            # secret'ı silinmez ve rutin otomasyon kırmızıya dönmez.
            SCOPE="all"
          fi
          echo "SYNC_SCOPE=$SCOPE STRICT_CORE=$STRICT_CORE"
          case "$SCOPE" in
            recovery) put_secret ADMIN_RECOVERY_SECRET ;;
            core)
              if [ "$STRICT_CORE" = "true" ]; then
                require_secret ADMIN_PASSWORD_SECRET
                require_secret ADMIN_SESSION_SECRET_SECRET
                require_secret MEDIA_SIGNING_SECRET
              fi
              put_secret ADMIN_PASSWORD_SECRET
              put_secret ADMIN_SESSION_SECRET_SECRET
              put_secret MEDIA_SIGNING_SECRET
              put_secret RESEND_API_KEY
              put_secret RESEND_TO
              put_secret RESEND_FROM
              ;;
            ai) put_secret OPENAI_API_KEY ;;
            metricool)
              put_secret METRICOOL_USER_TOKEN
              put_secret METRICOOL_USER_ID
              put_secret METRICOOL_BRAND_ID
              ;;
            windsor) put_secret WINDSOR_API_KEY ;;
            all)
              if [ "$STRICT_CORE" = "true" ]; then
                require_secret ADMIN_PASSWORD_SECRET
                require_secret ADMIN_SESSION_SECRET_SECRET
                require_secret MEDIA_SIGNING_SECRET
              fi
              put_secret ADMIN_PASSWORD_SECRET
              put_secret ADMIN_SESSION_SECRET_SECRET
              put_secret MEDIA_SIGNING_SECRET
              put_secret RESEND_API_KEY
              put_secret RESEND_TO
              put_secret RESEND_FROM
              put_secret OPENAI_API_KEY
              put_secret METRICOOL_USER_TOKEN
              put_secret METRICOOL_USER_ID
              put_secret METRICOOL_BRAND_ID
              put_secret WINDSOR_API_KEY
              ;;
            *) echo "Geçersiz scope: $SCOPE" >&2; exit 1 ;;
          esac

      - name: Verify Metricool API access
        if: steps.preflight.outputs.configured == 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.scope == 'metricool' || inputs.scope == 'all')
        env:
          METRICOOL_USER_TOKEN: ${{ secrets.BTMEDYA_METRICOOL_USER_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.BTMEDYA_METRICOOL_USER_ID }}
          METRICOOL_BRAND_ID: ${{ secrets.BTMEDYA_METRICOOL_BRAND_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$METRICOOL_USER_TOKEN" ] || [ -z "$METRICOOL_USER_ID" ] || [ -z "$METRICOOL_BRAND_ID" ]; then
            if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${SCOPE_INPUT:-}" = "metricool" ]; then
              echo "::error::Metricool aktarımı istendi ancak gerekli METRICOOL_USER_TOKEN, METRICOOL_USER_ID veya METRICOOL_BRAND_ID GitHub Secret'larından biri eksik."
              exit 1
            fi
            echo "::warning::Metricool doğrulaması GitHub secret eksikliği nedeniyle atlandı; canlı Worker bağlantısı değişmez."
            exit 0
          fi
          body="$(curl -fsS -H "X-Mc-Auth: $METRICOOL_USER_TOKEN" -H "Content-Type: application/json" "https://app.metricool.com/api/admin/simpleProfiles?userId=$METRICOOL_USER_ID")"
          python - "$METRICOOL_BRAND_ID" "$body" <<'PY'
          import json,sys
          wanted=str(sys.argv[1]); raw=sys.argv[2]
          data=json.loads(raw)
          items=data if isinstance(data,list) else data.get("data",data.get("profiles",[]))
          if not isinstance(items,list):
              raise SystemExit("FAIL Metricool profil yanıtı beklenen liste formatında değil")
          ids={str(x.get("blogId",x.get("id",""))) for x in items if isinstance(x,dict)}
          if wanted not in ids:
              raise SystemExit("FAIL Metricool Brand ID erişimi doğrulanamadı")
          print("OK Metricool API erişimi ve Brand ID doğrulandı")
          PY

      - name: Verify Windsor.ai API key
        if: steps.preflight.outputs.configured == 'true' && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.scope == 'windsor' || inputs.scope == 'all')
        env:
          WINDSOR_API_KEY: ${{ secrets.BTMEDYA_WINDSOR_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$WINDSOR_API_KEY" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${SCOPE_INPUT:-}" = "windsor" ]; then
              echo "::error::Windsor aktarımı istendi ancak BTMEDYA_WINDSOR_API_KEY GitHub Secret'ı eksik."
              exit 1
            fi
            echo "::warning::Windsor.ai anahtarı BTMEDYA_WINDSOR_API_KEY secret'ında yok; Worker'a aktarım atlandı."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          params=urllib.parse.urlencode({"api_key":os.environ["WINDSOR_API_KEY"]})
          request=urllib.request.Request(
              "https://connectors.windsor.ai/list_connectors?"+params,
              headers={"Accept":"application/json","User-Agent":"BTMEDYA-Windsor-Secret-Check/1.0"}
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  data=json.loads(response.read().decode("utf-8"))
                  if response.status != 200 or not isinstance(data, (list, dict)):
                      raise SystemExit("FAIL Windsor.ai API yanıtı doğrulanamadı")
          except Exception:
              raise SystemExit("FAIL Windsor.ai API anahtarı veya API erişimi doğrulanamadı; anahtar değeri loglanmadı")
          print("OK Windsor.ai API key validated (value hidden)")
          PY
