name: BTMEDYA Sync Worker Secrets

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Güncellenecek secret grubu"
        required: true
        type: choice
        options:
          - core
          - social
          - ai
          - all
        default: core

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install current Wrangler
        run: npm install --no-save --no-package-lock wrangler@latest

      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD_SECRET: ${{ secrets.BTMEDYA_ADMIN_PASSWORD_SECRET }}
          ADMIN_SESSION_SECRET_SECRET: ${{ secrets.BTMEDYA_ADMIN_SESSION_SECRET_SECRET }}
          MEDIA_SIGNING_SECRET: ${{ secrets.BTMEDYA_MEDIA_SIGNING_SECRET }}
          RESEND_API_KEY: ${{ secrets.BTMEDYA_RESEND_API_KEY }}
          RESEND_TO: ${{ secrets.BTMEDYA_RESEND_TO }}
          RESEND_FROM: ${{ secrets.BTMEDYA_RESEND_FROM }}
          META_ACCESS_TOKEN: ${{ secrets.BTMEDYA_META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.BTMEDYA_META_IG_USER_ID }}
          META_PAGE_ID: ${{ secrets.BTMEDYA_META_PAGE_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.BTMEDYA_TIKTOK_ACCESS_TOKEN }}
          TIKTOK_OPEN_ID: ${{ secrets.BTMEDYA_TIKTOK_OPEN_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.BTMEDYA_YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.BTMEDYA_YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.BTMEDYA_YOUTUBE_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.BTMEDYA_OPENAI_API_KEY }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN eksik}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID eksik}"

          put_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -z "$value" ]; then
              echo "SKIP $name (GitHub secret tanımlı değil)"
              return 0
            fi
            printf '%s' "$value" | npx wrangler secret put "$name" --name btmedya-db --config wrangler.toml
            echo "UPDATED $name"
          }

          case "$SCOPE" in
            core)
              put_secret ADMIN_PASSWORD_SECRET
              put_secret ADMIN_SESSION_SECRET_SECRET
              put_secret MEDIA_SIGNING_SECRET
              put_secret RESEND_API_KEY
              put_secret RESEND_TO
              put_secret RESEND_FROM
              ;;
            social)
              put_secret META_ACCESS_TOKEN
              put_secret META_IG_USER_ID
              put_secret META_PAGE_ID
              put_secret TIKTOK_ACCESS_TOKEN
              put_secret TIKTOK_OPEN_ID
              put_secret YOUTUBE_CLIENT_ID
              put_secret YOUTUBE_CLIENT_SECRET
              put_secret YOUTUBE_REFRESH_TOKEN
              ;;
            ai)
              put_secret OPENAI_API_KEY
              ;;
            all)
              put_secret ADMIN_PASSWORD_SECRET
              put_secret ADMIN_SESSION_SECRET_SECRET
              put_secret MEDIA_SIGNING_SECRET
              put_secret RESEND_API_KEY
              put_secret RESEND_TO
              put_secret RESEND_FROM
              put_secret META_ACCESS_TOKEN
              put_secret META_IG_USER_ID
              put_secret META_PAGE_ID
              put_secret TIKTOK_ACCESS_TOKEN
              put_secret TIKTOK_OPEN_ID
              put_secret YOUTUBE_CLIENT_ID
              put_secret YOUTUBE_CLIENT_SECRET
              put_secret YOUTUBE_REFRESH_TOKEN
              put_secret OPENAI_API_KEY
              ;;
            *)
              echo "Geçersiz scope: $SCOPE" >&2
              exit 1
              ;;
          esac
