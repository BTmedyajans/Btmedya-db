name: BTMEDYA Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: btmedya-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Verify Cloudflare Workers Build and production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source preflight
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source and assets
        run: |
          set -euo pipefail
          test -s src/worker.js
          test -s wrangler.toml
          test -s public/index.html
          test -s public/robots.txt
          test -s public/sitemap.xml
          node --check src/worker.js
          node --check src/metricool-scheduler.js
          node --check public/home.js
          python3 tools/validate-assets.py
          grep -q 'mobile-fixes.css' public/index.html
          grep -q 'prefers-reduced-motion' public/mobile-fixes.css
          grep -q 'Control Center' public/admin/index.html
          grep -q '/api/admin/control-center' public/admin/index.html
          grep -q '/kaynak-masasi' wrangler.toml
          test ! -e .github/workflows/media-smoke.yml
          test ! -e .github/workflows/storage-audit.yml

      - name: Apply remote D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          command: d1 migrations apply btmedya-media --remote

      - name: Deploy Worker and Assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          command: deploy --config wrangler.toml

      - name: Production smoke test
        run: |
          set -euo pipefail

          test "$(curl -L -s -o /dev/null -w "%{http_code}" --max-time 30 https://btmedya.com.tr/)" = "200"
          test "$(curl -L -s -o /dev/null -w "%{http_code}" --max-time 30 https://btmedya.com.tr/kaynak-masasi/)" = "200"
          test "$(curl -L -s -o /dev/null -w "%{http_code}" --max-time 30 https://btmedya.com.tr/robots.txt)" = "200"
          test "$(curl -L -s -o /dev/null -w "%{http_code}" --max-time 30 https://btmedya.com.tr/sitemap.xml)" = "200"

          health="$(curl -L -s --max-time 30 https://btmedya.com.tr/api/health)"
          echo "$health"
          echo "$health" | grep -q '"ok":true'
          echo "$health" | grep -q '"cms":true'
          echo "$health" | grep -q '"r2":true'

          media="$(curl -L -s --max-time 30 "https://btmedya.com.tr/api/public/media")"
          echo "$media" | grep -q '"items"'
          ! echo "$media" | grep -Eiq '\.(trashed|tmp|temp)(-|/)|thumbs\.db'

          social="$(curl -L -s --max-time 30 "https://btmedya.com.tr/api/public/social-feed")"
          echo "$social" | grep -q '"items"'

          home="$(curl -L -s --max-time 30 https://btmedya.com.tr/)"
          echo "$home" | grep -q 'GERÇEK ÇEKİM'
          echo "$home" | grep -q 'AI ÜRETİMİ'
          echo "$home" | grep -q 'Kaynak Masası'
          echo "$home" | grep -q 'https://www.instagram.com/btmedyajans/'

          www_status="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 https://www.btmedya.com.tr/)"
          test "$www_status" = "301"
