name: BTMEDYA Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: btmedya-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Verify Cloudflare Workers Build and production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Cloudflare Workers Build
        uses: actions/github-script@v7
        with:
          script: |
            const target = 'Workers Builds: btmedya-db';
            const sha = context.sha;
            const deadline = Date.now() + 10 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100
              });
              const check = data.check_runs.find(x => x.name === target && x.head_sha === sha);
              if (check?.status === 'completed') {
                if (check.conclusion !== 'success') {
                  core.setFailed(`Cloudflare Workers Build başarısız: ${check.conclusion || 'bilinmiyor'}`);
                } else {
                  core.notice('Cloudflare Workers Build başarılı.');
                }
                return;
              }
              await new Promise(r => setTimeout(r, 10000));
            }
            core.setFailed('Cloudflare Workers Build 10 dakika içinde sonuçlanmadı.');

      - name: Production smoke test
        run: |
          set -euo pipefail

          test "$(curl -L -s -o /dev/null -w "%{http_code}" --max-time 30 https://btmedya.com.tr/)" = "200"
          test "$(curl -L -s -o /dev/null -w "%{http_code}" --max-time 30 https://btmedya.com.tr/kaynak-masasi/)" = "200"
          test "$(curl -L -s -o /dev/null -w "%{http_code}" --max-time 30 https://btmedya.com.tr/robots.txt)" = "200"
          test "$(curl -L -s -o /dev/null -w "%{http_code}" --max-time 30 https://btmedya.com.tr/sitemap.xml)" = "200"

          health="$(curl -L -s --max-time 30 https://btmedya.com.tr/api/health)"
          echo "$health"
          echo "$health" | grep -q '"ok":true'
          echo "$health" | grep -q '"cms":true'
          echo "$health" | grep -q '"r2":true'

          media="$(curl -L -s --max-time 30 "https://btmedya.com.tr/api/public/media")"
          echo "$media" | grep -q '"items"'
          ! echo "$media" | grep -Eiq '\.(trashed|tmp|temp)(-|/)|thumbs\.db'

          home="$(curl -L -s --max-time 30 https://btmedya.com.tr/)"
          echo "$home" | grep -q 'GERÇEK ÇEKİM'
          echo "$home" | grep -q 'AI ÜRETİMİ'
          echo "$home" | grep -q 'Kaynak Masası'

          www_status="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 https://www.btmedya.com.tr/)"
          test "$www_status" = "301"
