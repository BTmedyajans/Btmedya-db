name: BTMEDYA Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: btmedya-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Verify Cloudflare Workers Build and production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source preflight
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source and assets
        run: |
          set -euo pipefail
          test -s src/worker.js
          test -s wrangler.toml
          test -s public/index.html
          test -s public/robots.txt
          test -s public/sitemap.xml
          node --check src/worker.js
          node --check src/metricool-scheduler.js
          node --check public/home.js
          python3 tools/validate-assets.py
          grep -q 'mobile-fixes.css' public/index.html
          grep -q 'prefers-reduced-motion' public/mobile-fixes.css
          grep -q 'Control Center' public/admin/index.html
          grep -q '/api/admin/control-center' public/admin/index.html
          grep -q '/kaynak-masasi' wrangler.toml
          test ! -e .github/workflows/media-smoke.yml
          test ! -e .github/workflows/storage-audit.yml

      - name: Wait for Cloudflare Workers Build
        uses: actions/github-script@v7
        with:
          script: |
            const target = 'Workers Builds: btmedya-db';
            const sha = context.sha;
            const deadline = Date.now() + 10 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100
              });
              const check = data.check_runs.find(x => x.name === target && x.head_sha === sha);
              if (check?.status === 'completed') {
                if (check.conclusion !== 'success') {
                  core.setFailed(`Cloudflare Workers Build başarısız: ${check.conclusion || 'bilinmiyor'}`);
                } else {
                  core.notice('Cloudflare Workers Build başarılı.');
                }
                return;
              }
              await new Promise(r => setTimeout(r, 10000));
            }
            core.setFailed('Cloudflare Workers Build 10 dakika içinde sonuçlanmadı.');

      - name: Production smoke test
        run: |
          set -euo pipefail

          resolve_ip() {
            local host="$1"
            local ip
            ip="$(dig +short A "$host" @1.1.1.1 | head -n1)"
            if [ -z "$ip" ]; then
              echo "DNS_RESOLVE_FAILED $host" >&2
              return 1
            fi
            echo "$ip"
          }

          HOME_IP="$(resolve_ip btmedya.com.tr)"
          WWW_IP="$(resolve_ip www.btmedya.com.tr)"
          echo "SMOKE DNS: btmedya.com.tr -> $HOME_IP"
          echo "SMOKE DNS: www.btmedya.com.tr -> $WWW_IP"

          curl_url() {
            local host="$1"
            local ip="$2"
            local url="$3"
            curl --resolve "$host:443:$ip" -L -sS --max-time 30 "$url"
          }

          check_http() {
            local label="$1"
            local host="$2"
            local ip="$3"
            local url="$4"
            local expected="$5"
            local actual
            actual="$(curl --resolve "$host:443:$ip" -L -sS -o /dev/null -w "%{http_code}" --max-time 30 "$url")"
            echo "SMOKE $label: HTTP $actual (expected $expected)"
            test "$actual" = "$expected"
          }

          check_http "home" "btmedya.com.tr" "$HOME_IP" "https://btmedya.com.tr/" "200"
          check_http "kaynak-masasi" "btmedya.com.tr" "$HOME_IP" "https://btmedya.com.tr/kaynak-masasi/" "200"
          check_http "robots" "btmedya.com.tr" "$HOME_IP" "https://btmedya.com.tr/robots.txt" "200"
          check_http "sitemap" "btmedya.com.tr" "$HOME_IP" "https://btmedya.com.tr/sitemap.xml" "200"

          health="$(curl_url btmedya.com.tr "$HOME_IP" https://btmedya.com.tr/api/health)"
          echo "SMOKE health: $health"
          echo "$health" | grep -q '"ok":true'
          echo "$health" | grep -q '"cms":true'
          echo "$health" | grep -q '"r2":true'

          media="$(curl_url btmedya.com.tr "$HOME_IP" "https://btmedya.com.tr/api/public/media")"
          echo "SMOKE media: $(printf '%s' "$media" | head -c 500)"
          echo "$media" | grep -q '"items"'
          ! echo "$media" | grep -Eiq '\\.(trashed|tmp|temp)(-|/)|thumbs\\.db'

          social="$(curl_url btmedya.com.tr "$HOME_IP" "https://btmedya.com.tr/api/public/social-feed")"
          echo "SMOKE social: $(printf '%s' "$social" | head -c 500)"
          echo "$social" | grep -q '"items"'

          home="$(curl_url btmedya.com.tr "$HOME_IP" https://btmedya.com.tr/)"
          for marker in 'GERÇEK ÇEKİM' 'AI ÜRETİMİ' 'Kaynak Masası' 'https://www.instagram.com/btmedyajans/'; do
            if grep -q "$marker" <<<"$home"; then
              echo "SMOKE home marker OK: $marker"
            else
              echo "SMOKE home marker MISSING: $marker"
              exit 1
            fi
          done

          www_status="$(curl --resolve "www.btmedya.com.tr:443:$WWW_IP" -sS -o /dev/null -w "%{http_code}" --max-time 30 https://www.btmedya.com.tr/)"
          echo "SMOKE www: HTTP $www_status (expected 301)"
          test "$www_status" = "301"
