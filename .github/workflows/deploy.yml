name: BTMEDYA Production Deploy

on:
  push:
    branches: [main]
    paths:
      - "wrangler.toml"
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: btmedya-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Cloudflare Worker and verify production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Source preflight
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate source and assets
        run: |
          set -euo pipefail
          test -s src/worker.js
          test -s wrangler.toml
          test -s public/index.html
          test -s public/robots.txt
          test -s public/sitemap.xml
          node --check src/worker.js
          node --check src/metricool-scheduler.js
          node --check public/home.js
          python3 tools/validate-assets.py
          grep -q 'mobile-fixes.css' public/index.html
          grep -q 'prefers-reduced-motion' public/mobile-fixes.css
          grep -q 'Control Center' public/admin/index.html
          grep -q '/api/admin/control-center' public/admin/index.html
          grep -q '/kaynak-masasi' wrangler.toml
          test ! -e .github/workflows/media-smoke.yml
          test ! -e .github/workflows/storage-audit.yml

      - name: Verify Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN eksik."; exit 1; }
          verify="$(curl -fsS --retry 2 --connect-timeout 10 --max-time 30             "https://api.cloudflare.com/client/v4/user/tokens/verify"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          echo "$verify" | jq -c '{success,result:{status:(.result.status // null)}}'
          test "$(jq -r '.success // false' <<<"$verify")" = "true"
          test "$(jq -r '.result.status // ""' <<<"$verify")" = "active"

      - name: Apply remote D1 migrations
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock wrangler@4.142.0 >/dev/null
          log="$(mktemp)"
          success=0
          for attempt in 1 2 3 4; do
            : > "$log"
            if npx --no-install wrangler d1 migrations apply btmedya-media --remote 2>&1 | tee "$log"; then
              success=1
              break
            fi
            if grep -qiE 'Rate limited|code: 10429' "$log"; then
              if [ "$attempt" -lt 4 ]; then
                delay=$((15 * 2 ** (attempt - 1)))
                echo "D1 rate limit (10429); retrying in " "$delay" "s..."
                sleep "$delay"
                continue
              fi
            fi
            if grep -qiE 'Authentication error|Invalid access token|code: 10000|code: 9109' "$log"; then
              echo "ERROR: Cloudflare token was rejected for D1. The token must be active and include D1 Edit/Write for btmedya-media."
            else
              echo "ERROR: D1 migration failed."
            fi
            exit 1
          done
          test "$success" = "1"

      - name: Deploy Worker and Assets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3 4; do
            log="$(mktemp)"
            if npx --no-install wrangler deploy --config wrangler.toml 2>&1 | tee "$log"; then
              success=1
              break
            fi
            if grep -qiE 'Rate limited|code: 10429' "$log" && [ "$attempt" -lt 4 ]; then
              delay=$((15 * 2 ** (attempt - 1)))
              echo "Worker deploy rate limited (10429); retrying in " "$delay" "s..."
              sleep "$delay"
              continue
            fi
            cat "$log"
            exit 1
          done
          test "$success" = "1"

      - name: Production smoke test
        run: |
          set -euo pipefail

          resolve_ip() {
            local host="$1"
            local ip
            ip="$(dig +short A "$host" @1.1.1.1 | head -n1)"
            if [ -z "$ip" ]; then
              echo "DNS resolver fallback via Cloudflare DoH: $host"
              doh="$(curl --resolve cloudflare-dns.com:443:1.1.1.1 -H 'accept: application/dns-json' -fsS --max-time 20 "https://cloudflare-dns.com/dns-query?name=$host&type=A")" || true
              ip="$(jq -r '.Answer[]? | select(.type==1) | .data' <<<"$doh" | head -n1)"
            fi
            if [ -z "$ip" ]; then
              echo "DNS_RESOLVE_FAILED $host" >&2
              return 1
            fi
            echo "$ip"
          }

          HOME_IP="$(resolve_ip btmedya.com.tr)"
          WWW_IP="$(resolve_ip www.btmedya.com.tr)"
          echo "SMOKE DNS: btmedya.com.tr -> $HOME_IP"
          echo "SMOKE DNS: www.btmedya.com.tr -> $WWW_IP"

          curl_url() {
            local host="$1"
            local ip="$2"
            local url="$3"
            curl --resolve "$host:443:$ip" -L -sS --max-time 30 "$url"
          }

          check_http() {
            local label="$1"
            local host="$2"
            local ip="$3"
            local url="$4"
            local expected="$5"
            local actual
            actual="$(curl --resolve "$host:443:$ip" -L -sS -o /dev/null -w "%{http_code}" --max-time 30 "$url")"
            echo "SMOKE $label: HTTP $actual (expected $expected)"
            test "$actual" = "$expected"
          }

          check_http "home" "btmedya.com.tr" "$HOME_IP" "https://btmedya.com.tr/" "200"
          check_http "kaynak-masasi" "btmedya.com.tr" "$HOME_IP" "https://btmedya.com.tr/kaynak-masasi/" "200"
          check_http "robots" "btmedya.com.tr" "$HOME_IP" "https://btmedya.com.tr/robots.txt" "200"
          check_http "sitemap" "btmedya.com.tr" "$HOME_IP" "https://btmedya.com.tr/sitemap.xml" "200"

          health="$(curl_url btmedya.com.tr "$HOME_IP" https://btmedya.com.tr/api/health)"
          echo "SMOKE health: $health"
          echo "$health" | grep -q '"ok":true'
          echo "$health" | grep -q '"cms":true'
          echo "$health" | grep -q '"r2":true'

          media="$(curl_url btmedya.com.tr "$HOME_IP" "https://btmedya.com.tr/api/public/media")"
          echo "SMOKE media: $(printf '%s' "$media" | head -c 500)"
          echo "$media" | grep -q '"items"'
          ! echo "$media" | grep -Eiq '\\.(trashed|tmp|temp)(-|/)|thumbs\\.db'

          social="$(curl_url btmedya.com.tr "$HOME_IP" "https://btmedya.com.tr/api/public/social-feed")"
          echo "SMOKE social: $(printf '%s' "$social" | head -c 500)"
          echo "$social" | grep -q '"items"'

          home="$(curl_url btmedya.com.tr "$HOME_IP" https://btmedya.com.tr/)"
          for marker in 'GERÇEK ÇEKİM' 'AI ÜRETİMİ' 'Kaynak Masası' 'https://www.instagram.com/btmedyajans/'; do
            if grep -q "$marker" <<<"$home"; then
              echo "SMOKE home marker OK: $marker"
            else
              echo "SMOKE home marker MISSING: $marker"
              exit 1
            fi
          done

          www_status="$(curl --resolve "www.btmedya.com.tr:443:$WWW_IP" -sS -o /dev/null -w "%{http_code}" --max-time 30 https://www.btmedya.com.tr/)"
          echo "SMOKE www: HTTP $www_status (expected 301)"
          test "$www_status" = "301"
