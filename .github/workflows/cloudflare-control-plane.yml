name: BTMEDYA Cloudflare Control Plane

on:
  push:
    branches: [main]
    paths:
      - "control-plane/reconcile-worker-domains.sh"
      - "wrangler.toml"
      - ".github/workflows/cloudflare-control-plane.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "audit veya apply"
        required: true
        type: choice
        options: [audit, apply]
        default: audit
      apply_dmarc:
        description: "DMARC p=quarantine değişikliğini uygula"
        required: true
        type: boolean
        default: false
      remove_resend_records:
        description: "send.* Resend/Amazon SES kayıtlarını sil (yalnızca bilinçli onay)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cloudflare-control-plane:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b239acae17aebe894ea76309fe32cdce
          ZONE_NAME: btmedya.com.tr
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Cloudflare deploy/API secret eksik."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID eksik."; exit 1; }
          response="$(curl -sS --retry 2 --connect-timeout 15 --max-time 45 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME")"
          success="$(jq -r '.success // false' <<<"$response")"
          zone_id="$(jq -r '.result[0].id // empty' <<<"$response")"
          if [[ "$success" != "true" || -z "$zone_id" ]]; then
            echo "::error::Cloudflare token zone erişim kontrolünden geçemedi."
            jq -c '{success,errors,messages}' <<<"$response"
            exit 1
          fi
          echo "Cloudflare API erişimi OK; zone_id=$zone_id"

      - name: Reconcile Worker Custom Domains
        if: ${{ github.event_name == 'push' || inputs.mode == 'apply' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b239acae17aebe894ea76309fe32cdce
          ZONE_NAME: btmedya.com.tr
          WORKER_NAME: btmedya-db
        run: |
          set -euo pipefail
          chmod +x control-plane/reconcile-worker-domains.sh
          ./control-plane/reconcile-worker-domains.sh | tee worker-domain-reconcile.log

      - name: Audit / apply Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b239acae17aebe894ea76309fe32cdce
          ZONE_NAME: btmedya.com.tr
          DEST_EMAIL: busetuncay74@gmail.com
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'audit' }}
          APPLY_DMARC: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_dmarc && '1' || '0' }}
          REMOVE_RESEND_RECORDS: ${{ github.event_name == 'workflow_dispatch' && inputs.remove_resend_records && '1' || '0' }}
        run: |
          set -o pipefail
          chmod +x control-plane/cloudflare-control-plane.sh
          ./control-plane/cloudflare-control-plane.sh | tee cloudflare-control-plane.log

      - name: Upload control-plane log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: btmedya-cloudflare-control-plane
          path: cloudflare-control-plane.log
          if-no-files-found: ignore
