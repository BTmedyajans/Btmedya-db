name: BTMedya production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: btmedya-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Workers Build
        uses: actions/github-script@v7
        with:
          script: |
            const target = 'Workers Builds: btmedya-db';
            const sha = context.sha;
            const deadline = Date.now() + 180000;
            let last = null;
            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100
              });
              const check = data.check_runs.find(x => x.name === target && x.head_sha === sha);
              if (check) {
                last = check;
                if (check.status === 'completed') {
                  if (check.conclusion !== 'success') {
                    core.setFailed(`Cloudflare Workers Build failed: ${check.conclusion || 'unknown'}`);
                  }
                  return;
                }
              }
              await new Promise(r => setTimeout(r, 5000));
            }
            core.setFailed(`Cloudflare Workers Build check not completed for ${sha}. Last state: ${last ? last.status : 'not found'}`);

      - name: Dagitim gercekten indi mi
        run: |
          set -eu
          # Smoke testi /api/health'e bakiyordu; o uc eski surumde de
          # calistigi icin "build basarili ama dagitim inmedi" durumu
          # sessizce geciyordu. 23 Eylul 2026'da iki birlestirme boyle
          # kaybedildi. Artik depodaki dosyanin ozeti canlidakiyle
          # karsilastiriliyor.
          kontrol() {
            yerel="$(sha256sum "public/$1" | cut -c1-64)"
            for i in $(seq 1 24); do
              canli="$(curl -fsS --max-time 20 "https://btmedya.com.tr/$1" | sha256sum | cut -c1-64)"
              if [ "$yerel" = "$canli" ]; then
                echo "  $1 guncel"
                return 0
              fi
              sleep 10
            done
            echo "HATA: $1 canlida eski surum. Cloudflare dagitimi inmedi."
            echo "  depo:  $yerel"
            echo "  canli: $canli"
            return 1
          }
          kontrol home.css
          kontrol home.js
          kontrol styles.css
          echo "Dagitim dogrulandi."

      - name: Production smoke test
        run: |
          set -eu
          for i in $(seq 1 18); do
            if curl -fsS --max-time 15 https://btmedya.com.tr/api/health > /tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            if [ "$i" -eq 18 ]; then
              echo "Production health endpoint did not become ready in time."
              exit 1
            fi
            sleep 5
          done
          curl -fsS --max-time 20 "https://btmedya.com.tr/api/news?limit=1" >/dev/null
          curl -fsS --max-time 20 https://btmedya.com.tr/robots.txt >/dev/null
          curl -fsS --max-time 20 https://btmedya.com.tr/sitemap.xml >/dev/null
          echo "BTMedya production smoke test OK"
