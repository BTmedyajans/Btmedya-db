name: BTMedya production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: btmedya-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cloudflare'in check run'i her zaman GitHub'a dusmuyor; 24 Eylul 2026'da
      # iki birlestirmede hic gorunmedi, dagitim yine de indi. Bu yuzden bu adim
      # yalnizca bilgi verir, kapi tutmaz. Kapiyi bir sonraki adim tutar:
      # canlidaki dosya depodakiyle ayni mi?
      - name: Cloudflare derleme durumu (bilgi)
        uses: actions/github-script@v7
        with:
          script: |
            const target = 'Workers Builds: btmedya-db';
            const sha = context.sha;
            const deadline = Date.now() + 120000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: sha, per_page: 100
              });
              const check = data.check_runs.find(x => x.name === target && x.head_sha === sha);
              if (check && check.status === 'completed') {
                if (check.conclusion !== 'success') {
                  core.setFailed(`Cloudflare Workers Build basarisiz: ${check.conclusion || 'bilinmiyor'}`);
                }
                core.notice(`Cloudflare derlemesi: ${check.conclusion}`);
                return;
              }
              await new Promise(r => setTimeout(r, 5000));
            }
            core.notice('Cloudflare check run 2 dakikada dusmedi; dagitim dogrulamasi bir sonraki adimda yapilir.');

      - name: Dagitim gercekten indi mi
        run: |
          set -eu
          # Smoke testi /api/health'e bakiyordu; o uc eski surumde de
          # calistigi icin "build basarili ama dagitim inmedi" durumu
          # sessizce geciyordu. 23 Eylul 2026'da iki birlestirme boyle
          # kaybedildi. Artik depodaki dosyanin ozeti canlidakiyle
          # karsilastiriliyor.
          # 24 Eylul 2026: derleme 35 dakika surdu. Dort dakikalik pencere
          # her birlestirmede kirmizi veriyordu; kurt masali isareti kimseye
          # bir sey anlatmaz. Pencere 20 dakika ve sonunda hata degil uyari
          # verilir. Gercekten takilan dagitimi dagitim-gecikmesi.yml yakalar.
          # Uc dosya ayri ayri degil, her turda birlikte bakilir: sirali
          # beklemede en kotu durum 20 degil 60 dakika olurdu.
          ozet() { sha256sum "public/$1" | cut -c1-64; }
          canli() { curl -fsS --max-time 20 "https://btmedya.com.tr/$1" 2>/dev/null | sha256sum | cut -c1-64; }
          DOSYALAR="home.css home.js styles.css"
          for i in $(seq 1 40); do
            eksik=""
            for f in $DOSYALAR; do
              [ "$(ozet "$f")" = "$(canli "$f")" ] || eksik="$eksik $f"
            done
            if [ -z "$eksik" ]; then
              echo "Dagitim dogrulandi ($((i * 30)) sn):$DOSYALAR"
              exit 0
            fi
            sleep 30
          done
          for f in $eksik; do
            echo "::warning::$f canlida hala eski surum (20 dk). depo=$(ozet "$f") canli=$(canli "$f")"
          done
          echo "Dagitim 20 dakikada inmedi; kuyrukta olabilir. dagitim-gecikmesi.yml izliyor."

      - name: Production smoke test
        run: |
          set -eu
          for i in $(seq 1 18); do
            if curl -fsS --max-time 15 https://btmedya.com.tr/api/health > /tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            if [ "$i" -eq 18 ]; then
              echo "Production health endpoint did not become ready in time."
              exit 1
            fi
            sleep 5
          done
          curl -fsS --max-time 20 "https://btmedya.com.tr/api/news?limit=1" >/dev/null
          curl -fsS --max-time 20 https://btmedya.com.tr/robots.txt >/dev/null
          curl -fsS --max-time 20 https://btmedya.com.tr/sitemap.xml >/dev/null
          echo "BTMedya production smoke test OK"
