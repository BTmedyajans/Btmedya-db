name: Deploy BTMedya Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btmedya-worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "CLOUDFLARE_API_TOKEN eksik."; exit 1; }
          echo "Cloudflare API token is present; Wrangler will use the pinned production account_id from wrangler.toml."

      # Production D1 already contains the required application tables.
      # Keep schema migrations in the dedicated admin workflow so a CI token
      # without D1 write permission cannot block an otherwise valid Worker deploy.
      - name: Deploy btmedya-db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml

      - name: Production smoke test
        run: |
          set -eu
          curl -fsS --max-time 20 https://btmedya.com.tr/api/health
          echo
          curl -fsS --max-time 20 "https://btmedya.com.tr/api/news?limit=1" >/dev/null
          echo "BTMedya production smoke test OK"
