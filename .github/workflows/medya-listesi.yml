name: BTMedya medya listesi

# Depoya medya eklendiginde kasanin listesini yeniden uretir. Boylece
# "GitHub'a yukle -> sitede gorun" akisi kod duzenlemeden tamamlanir.
#
# Dongu riski yok: tetikleyici public/assets/** yolunu izler, bu is ise
# yalnizca public/data/medya-listesi.json dosyasini yazar.

on:
  push:
    branches: [main]
    paths:
      - "public/assets/**"
      - "public/data/medya-ozel.json"
      - "tools/medya-listesi.mjs"
      - "tools/gerileme-denetimi.mjs"
      - "src/worker.js"
      - "public/**/*.css"
      - "public/index.html"
      - "public/data/haber-kapak-plani.json"
      - "public/data/kapak-fotograflari.json"
      - "public/data/haber-kapak-kaynagi.json"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: btmedya-medya-listesi
  cancel-in-progress: false

jobs:
  liste:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: CSS butunluk denetimi
        run: node tools/css-denetimi.mjs

      - name: Gerileme denetimi
        run: node tools/gerileme-denetimi.mjs

      - name: Listeyi yeniden uret
        run: node tools/medya-listesi.mjs

      - name: Degisiklik varsa PR ac
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: public/data/medya-listesi.json
          commit-message: "chore: medya listesini guncelle"
          branch: automation/update-media-list
          delete-branch: true
          title: "chore: medya listesini guncelle"
          body: "Medya listesi otomatik olarak yeniden üretildi. Bu PR, korunan main dalına doğrudan push yerine inceleme akışı kullanır."
