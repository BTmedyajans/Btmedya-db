name: BTMedya medya listesi

# Depoya medya eklendiginde kasanin listesini yeniden uretir. Boylece
# "GitHub'a yukle -> sitede gorun" akisi kod duzenlemeden tamamlanir.
#
# Dongu riski yok: tetikleyici public/assets/** yolunu izler, bu is ise
# yalnizca public/data/medya-listesi.json dosyasini yazar.

on:
  push:
    branches: [main]
    paths:
      - "public/assets/**"
      - "public/data/medya-ozel.json"
      - "tools/medya-listesi.mjs"
      - "tools/gerileme-denetimi.mjs"
      - ".github/workflows/medya-listesi.yml"
      - "src/worker.js"
      - "public/**/*.css"
      - "public/index.html"
      - "public/data/haber-kapak-plani.json"
      - "public/data/kapak-fotograflari.json"
      - "public/data/haber-kapak-kaynagi.json"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: btmedya-medya-listesi
  cancel-in-progress: false

jobs:
  liste:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Python for cover repair
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow for cover repair
        run: python -m pip install --quiet "Pillow>=10,<12"

      - name: CSS butunluk denetimi
        run: node tools/css-denetimi.mjs

      - name: Repair missing clean cover variants
        run: python3 tools/repair-cover-fotos.py

      - name: Gerileme denetimi
        run: node tools/gerileme-denetimi.mjs

      - name: Listeyi yeniden uret
        run: node tools/medya-listesi.mjs

      - name: Liste farkini raporla
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/data/medya-listesi.json; then
            echo "Medya katalogu guncel."
          else
            echo "::notice::Medya katalogu üreticiyle farkli; güncel katalog production kaynağına commit edilecek."
            mkdir -p .artifacts
            cp public/data/medya-listesi.json .artifacts/medya-listesi-generated.json
          fi

      # main korumalı (PR zorunlu + imzalı commit; GH013): doğrudan push her
      # seferinde reddediliyordu; koşucudan otomasyon dalına `git push` da
      # imzasız commit taşıdığı için reddedilir. Katalog GitHub API ile imzalı
      # commit olarak dönen otomasyon dalına yazılır ve PR açılır. Döngü yok:
      # tetikleyici yolları medya-listesi.json'u içermez.
      - name: Publish updated media catalog as a pull request
        uses: ./.github/actions/imzali-pr
        with:
          dal: automation/medya-listesi
          yollar: public/data/medya-listesi.json
          mesaj: "chore: refresh generated media catalog"
          pr_govde: "Generated by the BTMEDYA medya listesi workflow. main is protected (PR + signed commits required), so the catalog is published as a PR with an API-signed commit instead of a direct push."

      - name: Generated media catalog artifact
        if: always() && hashFiles('.artifacts/medya-listesi-generated.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: btmedya-generated-media-catalog
          path: .artifacts/medya-listesi-generated.json
          if-no-files-found: ignore
