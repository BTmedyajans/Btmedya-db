name: BTMEDYA Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btmedya-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, deploy and smoke-test production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Source and asset preflight
        shell: bash
        run: |
          set -euo pipefail
          test -s src/worker.js
          test -s wrangler.toml
          test -s public/index.html
          test -s public/home.js
          test -s package.json
          node --check src/worker.js
          node --check public/home.js
          python3 tools/validate-assets.py
          node tools/a11y-denetimi.mjs
          node tools/gerileme-denetimi.mjs
          node tools/link-denetimi.mjs
          node tools/mobile-regression-gate.mjs

      - name: Validate Cloudflare deploy token
        shell: bash
        env:
          CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CF_ACCOUNT_ID: b239acae17aebe894ea76309fe32cdce
        run: |
          set -euo pipefail
          if [ -z "${CF_DEPLOY_TOKEN:-}" ]; then
            echo "::error::Missing required GitHub Actions secret CLOUDFLARE_DEPLOY_TOKEN."
            exit 1
          fi
          echo "::add-mask::$CF_DEPLOY_TOKEN"
          verify="$(curl -sS --connect-timeout 10 --max-time 20 -H "Authorization: Bearer $CF_DEPLOY_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify || true)"
          state="$(jq -r '.result.status // empty' <<<"$verify" 2>/dev/null || true)"
          if [ "$state" != "active" ]; then
            verify="$(curl -sS --connect-timeout 10 --max-time 20 -H "Authorization: Bearer $CF_DEPLOY_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/tokens/verify" || true)"
            state="$(jq -r '.result.status // empty' <<<"$verify" 2>/dev/null || true)"
          fi
          if [ "$state" != "active" ]; then
            echo "::error::Cloudflare token is missing, inactive, or not accepted by the verification API."
            exit 1
          fi
          account_file="$(mktemp)"
          http_code="$(curl -sS --connect-timeout 10 --max-time 20 -o "$account_file" -w "%{http_code}" -H "Authorization: Bearer $CF_DEPLOY_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts")"
          if [ "$http_code" != "200" ] || ! jq -e --arg worker "btmedya-db" '.success == true and any(.result[]?; .id == $worker)' "$account_file" >/dev/null 2>&1; then
            rm -f "$account_file"
            echo "::error::Token cannot read Worker btmedya-db in the configured Cloudflare account."
            exit 1
          fi
          rm -f "$account_file"
          echo "CLOUDFLARE_API_TOKEN=$CF_DEPLOY_TOKEN" >> "$GITHUB_ENV"
          echo "Cloudflare token verified; secret value remains masked."

      - name: Install pinned Wrangler
        run: npm install --no-save --no-package-lock wrangler@4.142.0

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_ACCOUNT_ID: b239acae17aebe894ea76309fe32cdce
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.toml

      - name: Verify deployed health and public routes
        shell: bash
        run: |
          set -euo pipefail
          healthy=0
          for attempt in $(seq 1 12); do
            code="$(curl -sS --max-time 20 -o /tmp/btmedya-health.json -w "%{http_code}" https://btmedya.com.tr/api/health || true)"
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/btmedya-health.json; then
              healthy=1
              break
            fi
            echo "Health check attempt $attempt returned HTTP $code; retrying."
            sleep 5
          done
          test "$healthy" = "1"
          cat /tmp/btmedya-health.json

          home_code="$(curl -sS --max-time 20 -o /tmp/btmedya-home.html -w "%{http_code}" https://btmedya.com.tr/)"
          test "$home_code" = "200"
          grep -q 'BTMEDYA' /tmp/btmedya-home.html

          www_code="$(curl -sS --max-time 20 -o /dev/null -w "%{http_code}" https://www.btmedya.com.tr/)"
          test "$www_code" = "301"

          for path in robots.txt sitemap.xml news-sitemap.xml rss.xml; do
            code="$(curl -sS --max-time 20 -o /dev/null -w "%{http_code}" "https://btmedya.com.tr/$path")"
            test "$code" = "200"
            echo "SEO endpoint OK: $path HTTP $code"
          done
          echo "Production smoke test passed."
