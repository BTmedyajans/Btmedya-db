name: BTMEDYA production validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preflight source validation
        run: |
          set -eu
          test -s src/worker.js
          test -s wrangler.toml
          test -s public/index.html
          test -s public/robots.txt
          test -s public/sitemap.xml
          node --check src/worker.js
          grep -q 'main = "src/worker.js"' wrangler.toml
          grep -q 'pattern = "btmedya.com.tr"' wrangler.toml
          grep -q 'pattern = "www.btmedya.com.tr"' wrangler.toml
          grep -q 'bucket_name = "btmedya-media"' wrangler.toml
          grep -q 'database_name = "btmedya-media"' wrangler.toml
          test -d public
          test -d migrations

          # Referenced production assets must exist in the repository before deploy.
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("public")
          files = [
              Path("public/index.html"),
              Path("public/anasayfa.js"),
              Path("public/anasayfa.css"),
          ]
          refs = set()

          for src in files:
              if not src.exists():
                  continue
              text = src.read_text(errors="ignore")
              for match in re.findall(r'(?:src|href|url)=[\"\']?(/[^\"\'\s)?#]+)', text):
                  if match.startswith("/assets/"):
                      refs.add(match.lstrip("/"))

          missing = []
          for rel in sorted(refs):
              if not (root / rel).exists():
                  missing.append(rel)

          if missing:
              print("Missing local production assets:")
              print("\n".join(missing))
              raise SystemExit(1)

          required = [
              "assets/hero-scrub.mp4",
              "assets/hero-ending.jpg",
              "assets/media/web/showreel-action.mp4",
          ]
          missing_required = [p for p in required if not (root / p).exists()]
          if missing_required:
              print("Missing required production media:")
              print("\n".join(missing_required))
              raise SystemExit(1)

          print("Production media references: OK")
          PY
      - name: Cloudflare deployment handoff
        run: echo "Cloudflare Workers Builds is the production deployment authority."
      - name: Production health smoke test
        run: |
          set -eu
          headers=/tmp/health.headers
          body=/tmp/health.json
          code="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' --max-time 30 https://btmedya.com.tr/api/health || true)"
          if [ "$code" != "200" ]; then
            echo "Production /api/health returned HTTP $code"
            cat "$headers" || true
            sed -n '1,40p' "$body" || true
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "Likely pre-Worker Cloudflare Access/WAF/SAML protection. Worker code cannot remove a block applied before the request reaches the Worker."
            fi
            exit 1
          fi
          cat "$body"
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/health.json","utf8")); if(!x.ok||x.service!=="btmedya"||x.cms!==true||x.r2!==true||x.admin!==true) process.exit(1)'
          curl -fsS --max-time 30 "https://btmedya.com.tr/api/news?limit=1" > /dev/null
      - name: Admin protection smoke test
        run: |
          set -eu
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://btmedya.com.tr/api/admin/news)
          test "$status" = "401"
      - name: Domain smoke test
        run: |
          set -eu
          curl -fsSIL --max-time 30 https://btmedya.com.tr/ | head -n 20
          www_status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://www.btmedya.com.tr/)
          test "$www_status" = "301"
      - name: Google crawl files smoke test
        run: |
          set -eu
          curl -fsS --max-time 30 https://btmedya.com.tr/robots.txt | grep -Fq 'Sitemap: https://btmedya.com.tr/sitemap.xml'
          curl -fsS --max-time 30 https://btmedya.com.tr/sitemap.xml | grep -Fq '<urlset'
