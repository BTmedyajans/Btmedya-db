name: BTMEDYA Production Deploy
# Token validation trigger: 2026-10-12 — verify the repository's single CLOUDFLARE_DEPLOY_TOKEN.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/deploy-production.yml"
      - ".github/actions/cf-token-sec/**"
      - ".github/workflows/r2-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btmedya-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, deploy and smoke-test production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Python for cover integrity repair
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow for cover repair
        run: python -m pip install --quiet "Pillow>=10,<12"

      - name: Install FFmpeg for first-party hero media
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate source and assets
        shell: bash
        run: |
          set -euo pipefail
          test -s src/worker.js
          test -s src/autopilot.js
          test -s src/direct-social.js
          test -s public/index.html
          test -s public/robots.txt
          test -s public/sitemap.xml
          node --check src/worker.js
          node --check src/autopilot.js
          node --check src/direct-social.js
          node --check src/social-platforms.js
          node --check src/sosyal-otomasyon.js
          node --check src/yayin-zinciri.js
          node --check src/x-direct.js
          node --check src/buffer-social.js
          node --check src/tiktok-direct.js
          node --check src/youtube-direct.js
          # Bundle the supplied portrait/landscape entrance videos and posters into
          # first-party static assets so the browser never depends on GitHub redirects.
          mkdir -p public/assets/media/web
          curl -fsSL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3I87Wl91fYo7jAjCVYu9K4bPJ4B/b1902fbf-b7c7-4c73-aa75-27723438d2cb.mp4" -o public/assets/media/web/btmedya-hero-mobile.mp4
          curl -fsSL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3I87Wl91fYo7jAjCVYu9K4bPJ4B/939c6cbe-3fa1-462e-ba56-b6f37231a90c.mp4" -o public/assets/media/web/btmedya-hero-web-source.webm
          ffmpeg -hide_banner -loglevel error -y -i public/assets/media/web/btmedya-hero-web-source.webm -c:v libx264 -pix_fmt yuv420p -movflags +faststart -an public/assets/media/web/btmedya-hero-web.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 20 -i public/assets/media/web/btmedya-hero-mobile.mp4 -frames:v 1 -q:v 3 public/assets/media/web/btmedya-hero-mobile-poster.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 20 -i public/assets/media/web/btmedya-hero-web.mp4 -frames:v 1 -q:v 3 public/assets/media/web/btmedya-hero-web-poster.jpg
          # Generate WebM alternatives from the same supplied files for clients that need them.
          ffmpeg -hide_banner -loglevel error -y -i public/assets/media/web/btmedya-hero-mobile.mp4 -c:v libvpx-vp9 -b:v 0 -crf 32 -an public/assets/media/web/btmedya-hero-mobile.webm
          ffmpeg -hide_banner -loglevel error -y -i public/assets/media/web/btmedya-hero-web.mp4 -c:v libvpx-vp9 -b:v 0 -crf 34 -an public/assets/media/web/btmedya-hero-web.webm
          # Validate all authored paths, followed by checks for the generated hero deliverables.
          python3 tools/repair-cover-fotos.py
          python3 tools/validate-assets.py
          for asset in public/assets/media/web/btmedya-hero-mobile.mp4 public/assets/media/web/btmedya-hero-mobile.webm public/assets/media/web/btmedya-hero-mobile-poster.jpg public/assets/media/web/btmedya-hero-web.mp4 public/assets/media/web/btmedya-hero-web.webm public/assets/media/web/btmedya-hero-web-poster.jpg; do test -s "$asset"; done
          node tools/sosyal-otomasyon-testi.mjs
          node tools/yayin-zinciri-testi.mjs
          node tools/gerileme-denetimi.mjs
          node tools/link-denetimi.mjs
          node tools/mobile-regression-gate.mjs
          node tools/ux-seo-contract.mjs

      - name: Validate the single production deploy token
        shell: bash
        env:
          CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CF_ACCOUNT_ID: b239acae17aebe894ea76309fe32cdce
        run: |
          set -euo pipefail
          if [ -z "${CF_DEPLOY_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_DEPLOY_TOKEN. Add one dedicated Cloudflare API token with Workers Editor for btmedya-db and Workers Routes Write for the btmedya.com.tr zone."
            exit 1
          fi
          echo "::add-mask::$CF_DEPLOY_TOKEN"
          # The token may be a user-scoped token or an Account API token.
          # Cloudflare has separate verify endpoints for these two token types.
          verify="$(curl -sS --connect-timeout 10 --max-time 20 -H "Authorization: Bearer $CF_DEPLOY_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify || true)"
          state="$(jq -r '.result.status // empty' <<<"$verify" 2>/dev/null || true)"
          if [ "$state" != "active" ]; then
            verify="$(curl -sS --connect-timeout 10 --max-time 20 -H "Authorization: Bearer $CF_DEPLOY_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/tokens/verify" || true)"
            state="$(jq -r '.result.status // empty' <<<"$verify" 2>/dev/null || true)"
          fi
          if [ "$state" != "active" ]; then
            echo "::error::CLOUDFLARE_DEPLOY_TOKEN failed both user-scoped and account-scoped token verification endpoints. Check that the complete token value was saved in this GitHub Secret and that the Cloudflare token is still active."
            exit 1
          fi
          access_file="$(mktemp)"
          http_code="$(curl -sS --connect-timeout 10 --max-time 20 -o "$access_file" -w "%{http_code}" -H "Authorization: Bearer $CF_DEPLOY_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts")"
          if [ "$http_code" != "200" ] || ! jq -e --arg worker "btmedya-db" '.success == true and any(.result[]?; .id == $worker)' "$access_file" >/dev/null 2>&1; then
            rm -f "$access_file"
            echo "::error::The active token cannot access Worker btmedya-db in the target account. Recreate CLOUDFLARE_DEPLOY_TOKEN with Workers Editor scoped to this Worker (or the Workers product) and, because this config declares custom domains, Workers Routes Write scoped to the btmedya.com.tr zone."
            exit 1
          fi
          rm -f "$access_file"
          echo "CLOUDFLARE_API_TOKEN=$CF_DEPLOY_TOKEN" >> "$GITHUB_ENV"
          echo "Cloudflare token is active and can read the target Worker. The deploy step will verify write permission."


      - name: Install pinned Wrangler
        run: npm install --no-save --no-package-lock wrangler@4.142.0

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_ACCOUNT_ID: b239acae17aebe894ea76309fe32cdce
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler deploy --config wrangler.toml; then
            echo "::error::Cloudflare rejected access to the existing Worker btmedya-db. The token passed the read-only preflight but likely lacks Workers Editor access. In Cloudflare API Tokens, grant Workers Editor to the btmedya-db Worker (or Workers product) in account b239acae17aebe894ea76309fe32cdce, then update GitHub Actions secret CLOUDFLARE_DEPLOY_TOKEN and rerun this workflow. Do not paste the token into chat or source code."
            exit 1
          fi

      - name: Verify live site and API
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 12); do
            code="$(curl -sS -o /tmp/btmedya-health.json -w "%{http_code}" --max-time 20 https://btmedya.com.tr/api/health || true)"
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/btmedya-health.json; then
              ok=1
              break
            fi
            echo "Health check attempt $attempt returned HTTP $code; retrying."
            sleep 5
          done
          test "$ok" = "1"
          cat /tmp/btmedya-health.json
          home_code="$(curl -sS -o /tmp/btmedya-home.html -w "%{http_code}" --max-time 20 https://btmedya.com.tr/)"
          test "$home_code" = "200"
          grep -q 'BTMEDYA' /tmp/btmedya-home.html
          www_code="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 https://www.btmedya.com.tr/)"
          test "$www_code" = "301"
          echo "Production smoke test passed: home=$home_code, www=$www_code, health=200."
