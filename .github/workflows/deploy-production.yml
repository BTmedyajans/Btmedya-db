name: BTMEDYA production validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preflight source validation
        run: |
          set -eu
          test -s src/worker.js
          test -s wrangler.toml
          test -s public/index.html
          node --check src/worker.js
          grep -q 'main = "src/worker.js"' wrangler.toml
          test -d public

      - name: Cloudflare deployment handoff
        run: |
          echo "Cloudflare Workers Builds is the production deployment authority."
          echo "GitHub main is validated here; Cloudflare deploys the connected Worker from main."

      - name: Production smoke test
        run: |
          set -eu
          curl -fsS --max-time 30 https://btmedya.com.tr/api/health
          echo
          curl -fsS --max-time 30 "https://btmedya.com.tr/api/news?limit=1"
          echo
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://btmedya.com.tr/api/admin/news)
          test "$status" = "401"
          curl -fsSIL --max-time 30 https://btmedya.com.tr/ | head -n 20
